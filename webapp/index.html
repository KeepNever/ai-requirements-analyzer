<!--
正式前端：由 prototype/saas-ui-v1.html 设计稿转正。
视觉层沿用原型；数据层全部对接 web_demo.py 真实 API（/api/me、/api/overview、/api/report、
/api/clean、/run-text、/api/ask、/api/admin/users、/api/auth/*）。
角色矩阵与后端 src/auth.py PAGE_ACCESS 保持一致，前端过滤仅做展示，后端为最终边界。
-->
<style>
:root{--blue:#2b5cff;--blue-dark:#1f46c8;--blue-soft:#eef2ff;--ink:#1c2536;--muted:#68758a;--line:#e3e8f0;--bg:#f5f7fb;--panel:#fff;--green:#16855c;--green-soft:#eaf7f1;--amber:#a96300;--amber-soft:#fff6e6;--red:#c4404e;--red-soft:#fff0f1;--sidebar:232px}

.login{min-height:100vh;display:grid;grid-template-columns:minmax(420px,1.12fr) minmax(440px,.88fr);background:#fff}.login-story{position:relative;overflow:hidden;background:#173da8;color:#fff;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}.login-story:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}.brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;letter-spacing:.02em}.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:700}.login-story .brand-mark{background:#fff;color:#173da8}.story-main{position:relative;z-index:1;max-width:600px}.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#b9caff;margin-bottom:20px}.story-main h1{font-size:42px;line-height:1.28;letter-spacing:-.03em;margin-bottom:18px;font-weight:650}.story-main>p{color:#d6dfff;font-size:16px;max-width:470px}.evidence-flow{margin-top:48px;background:rgba(8,27,86,.35);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:22px 24px;backdrop-filter:blur(4px)}.flow-quote{font-size:14px;color:#fff}.flow-quote b{color:#cbd8ff;margin-right:9px}.flow-line{height:1px;background:rgba(255,255,255,.16);margin:17px 0}.flow-result{display:grid;grid-template-columns:1fr 1fr;gap:20px}.flow-result span{display:block;color:#aebfef;font-size:11px;margin-bottom:5px}.flow-result b{font-size:13px;font-weight:500}.login-foot{position:relative;z-index:1;color:#aebfef;font-size:12px}.login-form-side{display:grid;place-items:center;padding:48px}.login-form{width:100%;max-width:400px}.login-form h2{font-size:28px;margin-bottom:8px}.login-form .sub{color:var(--muted);margin-bottom:34px}.field{margin-bottom:18px}.field label{display:b .app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}.sidebar .brand{height:72px;padding:0 22px;border-bottom:1px solid var(--line);font-size:14px}.sidebar .brand-mark{width:31px;height:31px;font-size:14px;flex:none}.nav{padding:22px 14px;flex:1}.nav-label{font-size:10px;color:#9aa4b4;letter-spacing:.16em;padding:0 12px;margin:15px 0 7px}.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;margin:3px 0;border-radius:7px;color:#536176;cursor:pointer;font-size:13px}.nav-item:hover{background:var(--bg);color:var(--ink)}.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:600}.nav-dot{width:6px;height:6px;border:1.5px solid currentColor;border-radius:2px;flex:none}.nav-item.active .nav-dot{background:var(--blue);border-color:var(--blue)}.sidebar-foot{padding:16px 18px;border-top:1px solid var(--line)}.version{font-size:11px;color:#9aa4b4;margin-top:8px}.main{margin-left:var(--sidebar);min-height:100vh}.topbar{height:72px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:8}.breadcrumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:14px}.avatar{width:32px;height:32px;border-radius:50%;background:#202d49;color:#fff;display:grid;place-items:center;font-size:12px}.content{max-width:1380px;margin:0 auto;padding:32px 36px 64px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:26px}.page-head h1{font-size:25px;line-height:1.35;margin-bottom:5px}.page-head p{color:var(--muted);font-size:13px}.head-actions{display:flex;gap:10px;flex:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}.panel-title{font-size:15px;margin-bottom:4px}.panel-sub{font-size:12px;color:var(--muted);margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:18px 20px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:27px;line-height:1.3;margin:5px 0 2px;font-weight:650}.stat-note{font-size:11px;color:#8a95a7}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:500;background:#fafbfc;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 12px;white-space:nowrap}td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcff}.project-name{font-size:13px;font-weight:600;margin-bottom:2px}.todo-list{margin-top:12px}.todo{padding:14px 0;border-bottom:1px solid var(--line)}.todo:last-child{border-bottom:0}.todo b{font-size:12px;display:block;margin-bottom:3px}.todo p{font-size:12px;color:var(--muted)}.notice{padding:12px 15px;background:var(--blue-soft);border-radius:7px;color:#3151ae;font-size:12px;margin-bottom:20px}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:22px}.tab{padding:0 1px 11px;color:var(--muted);font-size:13px;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue);font-weight:600}.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.steps{display:flex;align-items:center;margin-bottom:24px}.step{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.step-num{width:25px;height:25px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff}.step.active{color:var(--blue);font-weight:600}.step.active .step-num{background:var(--blue);border-color:var(--blue);color:#fff}.step.done .step-num{background:var(--green);border-color:var(--green);color:#fff}.step-line{height:1px;background:var(--line);width:70px;margin:0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.upload-box{border:1px dashed #bdc8db;border-radius:9px;background:#fafbfe;padding:30px;text-align:center;margin:20px 0 16px;cursor:pointer}.upload-box:hover{border-color:var(--blue);background:var(--blue-soft)}.upload-title{font-weight:600;margin-bottom:4px}.upload-box p{font-size:12px;color:var(--muted)}textarea{resize:vertical;min-height:150px;line-height:1.7}.form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.cost{font-size:12px;color:var(--muted)}.clean-result{margin-top:20px;border-top:1px solid var(--line);padding-top:20px}.clean-stats{display:flex;gap:30px;margin:14px 0;flex-wrap:wrap}.clean-stats b{display:block;font-size:20px}.clean-stats span{font-size:11px;color:var(--muted)}.segment{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.segment b{color:var(--blue);margin-right:9px}
.report-head{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px}.report-title-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}.report-title-row h1{font-size:23px}.report-meta{display:flex;gap:20px;color:var(--muted);font-size:12px;flex-wrap:wrap}.report-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.evidence{border-left:3px solid #b7c5ef;background:#f8faff;padding:12px 15px;margin:14px 0;color:#4a5971;font-size:12px}.evidence b{color:var(--blue);margin-right:8px}.report-summary{font-size:14px;line-height:1.9;margin-bottom:20px}.side-section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}.side-section:last-child{border:0;margin:0;padding:0}.side-section h3{font-size:12px;margin-bottom:10px}.side-item{font-size:12px;color:var(--muted);padding:4px 0}.question-chain{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.chain-box{background:var(--bg);padding:13px;border-radius:7px;font-size:12px}.chain-box span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.comment-box{margin-top:16px}.comment-box textarea{min-height:80px}
.chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.chat-panel{min-height:610px;display:flex;flex-direction:column}.chat-log{flex:1;max-height:480px;overflow:auto;padding:4px 0 18px}.message{margin:16px 0;max-width:88%}.message.user{margin-left:auto;text-align:right}.bubble{display:inline-block;text-align:left;background:#f1f3f7;border-radius:9px;padding:11px 14px;font-size:13px;white-space:pre-wrap}.message.user .bubble{background:var(--blue);color:#fff}.citations{margin-top:8px;border-left:2px solid #bcc9ee;padding-left:11px;font-size:11px;color:var(--muted)}.chat-input{display:flex;gap:10px;border-top:1px solid var(--line);padding-top:16px}.chat-input textarea{min-height:62px;flex:1}.chat-input .btn{align-self:flex-end}.suggestion{padding:11px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--blue);cursor:pointer}.suggestion:last-child{border:0}
.permission-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role-card{border:1px solid var(--line);border-radius:8px;padding:15px}.role-card h3{font-size:13px;margin-bottom:4px}.role-card p{font-size:11px;color:var(--muted)}.member-person{display:flex;align-items:center;gap:9px}.mini-avatar{width:28px;height:28px;border-radius:50%;background:#edf1fa;color:#4d5d7a;display:grid;place-items:center;font-size:11px}.member-person b{display:block;font-size:12px}.member-person span{display:block;color:var(--muted);font-size:10px}.no-access{max-width:560px;margin:90px auto;text-align:center}.no-access h1{font-size:22px;margin-bottom:8px}.no-access p{color:var(--muted);margin-bottom:22px}
.toast{position:fixed;right:26px;bottom:26px;background:#202b40;color:#fff;padding:11px 17px;border-radius:8px;font-size:12px;box-shadow:0 8px 30px rgba(20,30,50,.18);z-index:100;animation:toastin .2s ease}@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.loading{padding:60px 24px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:1100px){.dashboard-grid,.report-layout,.chat-layout,.permission-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.login-story{padding:48px}.story-main h1{font-size:34px}}
@media(max-width:820px){:root{--sidebar:72px}.sidebar .brand{padding:0;justify-content:center}.sidebar .brand span,.nav-label,.nav-item span,.sidebar-foot{display:none}.nav-item{justify-content:center}.nav-item .nav-dot{width:8px;height:8px}.content{padding:24px 20px}.topbar{padding:0 20px}.login{grid-template-columns:1fr}.login-story{display:none}.page-head{flex-direction:column}.head-actions{width:100%}}
@media(max-width:560px){.stats,.form-grid,.role-cards,.question-chain{grid-template-columns:1fr}.content{padding:20px 14px}.breadcrumb{display:none}.login-form-side{padding:28px}.steps{flex-wrap:wrap;gap:10px}.step-line{width:20px;margin:0 4px}.panel{padding:17px}.report-meta{flex-direction:column;gap:2px}}
</style>

<body>
<div id="root"></div>
<script>
const ROLE_PAGES={
 admin:['dashboard','report','members'],
 pm:['dashboard','new','report','chat'],
 sales:['dashboard','new','report','chat'],
 presale:['dashboard','report','chat']};
const ROLE_NAMES={admin:'管理员',pm:'产品经理',sales:'销售',presale:'售前'};
const ROLE_DESC={admin:'账号、角色和项目授权',pm:'分析、修正、确认和导出',sales:'提交材料与处理客户追问',presale:'能力匹配查看与补充意见'};
const PAGE_NAMES={dashboard:'项目工作台',new:'新建分析',report:'分析报告',chat:'材料问答',members:'成员与权限'};
const NAV_ITEMS=[['dashboard','项目工作台'],['new','新建分析'],['chat','材料问答'],['members','成员与权限']];
const VERDICT_CLASS={'匹配':'green','部分匹配':'amber','待确认':'gray','不支持':'red'};
const state={booting:true,user:null,page:'dashboard',overview:[],overviewLoading:true,
 projectView:'projects',versionPid:'',versions:null,
 reportId:'',report:null,reportLoading:false,reportTab:'needs',
 scene:'presale',material:'',clean:null,cleanLoading:false,running:false,
 chatPid:'',chatMode:'mock',chatConv:'',chatMsgs:[],chatBusy:false,
 members:[],membersLoading:false,addOpen:false};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function can(p){return !!(state.user&&ROLE_PAGES[state.user.role]&&ROLE_PAGES[state.user.role].includes(p))}

async function api(path,opts={}){
 const init={method:opts.method||'GET',headers:{}};
 if(opts.body!==undefined){init.headers['Content-Type']='application/json';init.body=JSON.stringify(opts.body)}
 const r=await fetch(path,init);
 let data={};try{data=await r.json()}catch(e){}
 if(r.status===401){state.user=null;state.page='login';render();throw new Error(data.error||'未登录')}
 if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
 return data;
}

async function boot(){
 try{state.user=await api('/api/me');state.page='dashboard';await loadOverview(false);}
 catch(e){state.page='login'}
 state.booting=false;render();
}
async function loadOverview(spinner=true){
 if(spinner){state.overviewLoading=true;render()}
 try{state.overview=await api('/api/overview')}catch(e){if(state.user)toast('加载项目失败：'+e.message)}
 state.overviewLoading=false;
}
function askableProjects(){return state.overview.filter(x=>x.source==='project')}

async function doLogin(form){
 const f=new FormData(form);
 try{
  state.user=await api('/api/auth/login',{method:'POST',body:{email:f.get('email'),password:f.get('password')}});
  state.page='dashboard';await loadOverview(false);
 }catch(e){showAuthError(e.message);return}
 render();
}
async function doRegister(form){
 const f=new FormData(form);
 if(f.get('password')!==f.get('password2')){showAuthError('两次输入的密码不一致');return}
 try{
  state.user=await api('/api/auth/register',{method:'POST',body:{name:f.get('name'),org:f.get('org'),email:f.get('email'),password:f.get('password')}});
  state.page='dashboard';await loadOverview(false);
 }catch(e){showAuthError(e.message);return}
 render();toast('团队创建成功，你已成为管理员');
}
async function doLogout(){
 try{await api('/api/auth/logout',{method:'POST'})}catch(e){}
 state.user=null;state.page='login';render();
}
function showAuthError(msg){const el=document.getElementById('authError');if(el){el.textContent=msg;el.classList.remove('hidden')}}

function go(page){
 if(!can(page)){toast('当前角色没有此页面权限');return}
 state.page=page;
 if(page==='dashboard')loadOverview();
 if(page==='chat'&&!state.overview.length)loadOverview(false);
 if(page==='members')loadMembers();
 render();window.scrollTo(0,0);
}
function setProjectView(v){state.projectView=v;render()}
function setReportTab(k){state.reportTab=k;render()}
function setScene(v){state.scene=v;render()}
function setMaterial(v){state.material=v}
function setChatPid(v){state.chatPid=v;state.chatConv='';state.chatMsgs=[];render()}
function setChatMode(v){state.chatMode=v;state.chatConv='';render()}
function resetChat(){state.chatConv='';state.chatMsgs=[];render()}

async function doClean(){
 if(!state.material.trim()){toast('请先粘贴或上传材料');return}
 state.cleanLoading=true;render();
 try{state.clean=await api('/api/clean',{method:'POST',body:{material:state.material}})}
 catch(e){toast('清洗失败：'+e.message)}
 state.cleanLoading=false;render();
}
async function doRun(){
 if(!state.material.trim()){toast('请先粘贴或上传材料');return}
 state.running=true;render();
 try{
  const r=await api('/run-text',{method:'POST',body:{material:state.material,scene:state.scene}});
  state.running=false;state.clean=null;state.material='';
  toast('分析完成');
  openReport(r.case);
 }catch(e){state.running=false;toast('分析失败：'+e.message);render()}
}
function pickFile(input){
 const file=input.files&&input.files[0];
 if(!file)return;
 file.text().then(t=>{state.material=t;render();toast('已读取 '+file.name)});
}
async function openReport(id){
 state.reportId=id;state.report=null;state.reportLoading=true;state.page='report';
 const tabs=reportTabs();state.reportTab=tabs[0].key;
 render();
 try{state.report=await api('/api/report/'+encodeURIComponent(id))}
 catch(e){state.report={error:e.message}}
 state.reportLoading=false;render();window.scrollTo(0,0);
}
function reportTabs(){
 if(state.user.role==='sales')return[{key:'questions',label:'待确认与追问'}];
 if(state.user.role==='presale')return[{key:'capability',label:'能力匹配'},{key:'questions',label:'待确认信息'}];
 return[{key:'needs',label:'需求分析'},{key:'capability',label:'能力匹配'},{key:'questions',label:'待确认追问'},{key:'audit',label:'修正记录'}];
}
async function askSuggested(text){
 const box=document.getElementById('question');if(box)box.value=text;
 await sendQuestion();
}
async function sendQuestion(){
 const box=document.getElementById('question');
 const q=(box?box.value:'').trim();
 if(!q){toast('请输入问题');return}
 if(!state.chatPid){toast('请先选择项目');return}
 if(state.chatBusy)return;
 state.chatMsgs.push({from:'user',text:q});state.chatBusy=true;box.value='';render();
 try{
  const r=await api('/api/ask',{method:'POST',body:{project_id:state.chatPid,question:q,mock:state.chatMode==='mock',conversation_id:state.chatConv||null}});
  state.chatConv=r.conversation_id||state.chatConv;
  state.chatMsgs.push({from:'ai',text:r.answer,cites:r.frontend_citations||[],insufficient:!r.sufficient});
 }catch(e){state.chatMsgs.push({from:'ai',text:'出错了：'+e.message})}
 state.chatBusy=false;render();
 const log=document.querySelector('.chat-log');if(log)log.scrollTop=log.scrollHeight;
}
async function loadMembers(){
 if(state.user.role!=='admin')return;
 state.membersLoading=true;render();

function exportReport(){
 if(state.report&&state.report.export_url&&state.user.role!=='sales'){location.href=state.report.export_url;return}

  const pend=(state.report&&(state.report.questions||(state.report.analysis&&state.report.analysis.node2&&state.report.analysis.node2.pending_confirmations)))||[];
  const lines=pend.map(n=>'【'+(n.level||'')+'】缺口：'+n.gap+'｜影响：'+n.impact+'｜建议追问：'+n.question).join('\n');

function pill(v,cls){return `<span class="pill ${cls}">${esc(v)}</span>`}
function needsBody(a){
 const n1=a.node1||{},n2=a.node2||{},pri=a.priority||[];
 const tierMap={};pri.forEach(x=>{tierMap[x.id]=x.tier});
 const high=pri.filter(x=>x.tier==='高').length;
 const en=(n1.explicit_needs||[]),pn=(n2.potential_needs||[]),pend=(n2.pending_confirmations||[]);
 const quote=en[0]?`<div class="evidence"><b>${esc((en[0].dids||[]).join('、')||'引用')}</b>「${esc(en[0].quote||en[0].content||'')}」</div>`:'';
 const enRows=en.map(n=>`<tr><td class="strong">${esc(n.id)}</td><td>${esc(n.content)}</td><td>${tierMap[n.id]?pill(tierMap[n.id],tierMap[n.id]==='高'?'blue':tierMap[n.id]==='中'?'amber':'gray'):'<span class="muted">—</span>'}</td><td><span class="pill gray">草稿</span></td></tr>`).join('')||'<tr><td colspan="4" class="muted">无</td></tr>';
 const pnRows=pn.map(n=>`<tr><td class="strong">${esc(n.id)}</td><td>${esc(n.content)}</td><td class="muted">${esc(n.reasoning||'')}</td><td>${esc(n.confidence||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">无</td></tr>';
 const priRows=pri.slice(0,6).map(x=>`<tr><td class="strong">${esc(x.id)}</td><td>${esc((x.content||'').slice(0,24))}</td><td>${x.weighted}</td><td>${pill(x.tier,x.tier==='高'?'blue':x.tier==='中'?'amber':'gray')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">无</td></tr>';
 return `<div class="report-layout"><section class="panel"><h2 class="panel-title">需求分析摘要</h2><p class="panel-sub">AI 提取与推断分离，所有判断保留原文依据</p><p class="report-summary">显性需求 ${en.length} 条（高优先级 ${high} 条）；潜在需求 ${pn.length} 条；待确认 ${pend.length} 条（决定性 ${pend.filter(x=>x.level==='决定性').length} 条）。本报告为草稿态，优先级结论、能力匹配与待确认分级须经产品经理确认后方可进入需求池。</p>${quote}<div class="table-wrap"><table><thead><tr><th>编号</th><th>显性需求</th><th>优先级</th><th>状态</th></tr></thead><tbody>${enRows}</tbody></table></div><h2 class="panel-title" style="margin-top:24px">潜在需求（推断）</h2><div class="table-wrap"><table><thead><tr><th>编号</th><th>需求</th><th>推断线索</th><th>置信度</th></tr></thead><tbody>${pnRows}</tbody></table></div><h2 class="panel-title" style="margin-top:24px">优先级建议（Top 6）</h2><div class="table-wrap"><table><thead><tr><th>编号</th><th>需求</th><th>加权</th><th>档位</th></tr></thead><tbody>${priRows}</tbody></table></div></section><aside class="panel"><div class="side-section"><h3>报告口径</h3><div class="side-item">AI 结果为草稿，不自动进入排期</div><div class="side-item">潜在需求必须经人工确认</div><div class="side-item">引用基于清洗后 D 编号原文</div></div><div class="side-section"><h3>下一步</h3><button class="btn secondary small" onclick="setReportTab('questions')">查看 ${pend.length} 项待确认问题</button></div></aside></div>`;
}
function capabilityBody(a){
 const caps=((a.node2||{}).capability_match)||[];
 const rows=caps.map(n=>`<tr><td>${esc(n.target)}</td><td>${pill(n.verdict,VERDICT_CLASS[n.verdict]||'gray')}</td><td class="muted">${esc(n.reason)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">无</td></tr>';
 return `<section class="panel"><h2 class="panel-title">产品能力匹配</h2><p class="panel-sub">结论分为匹配、部分匹配、待确认和不支持，不强行归类</p><div class="table-wrap"><table><thead><tr><th>对象</th><th>匹配结论</th><th>判断依据</th></tr></thead><tbody>${rows}</tbody></table></div>${state.user.role==='presale'?`<div class="comment-box"><label class="strong small-text">补充售前意见</label><textarea placeholder="记录能力边界、实现条件或方案建议（下一轮接入保存）"></textarea></div>`:''}</section>`;
}
function questionsBody(a,r){
 const pend=(r.questions)||((a.node2||{}).pending_confirmations)||[];
 if(!pend.length)return '<section class="panel"><div class="empty">本分析没有待确认问题，信息缺口已收敛。</div></section>';
 const items=pend.map((n,i)=>`<div class="evidence" style="margin-top:${i?'18px':'14px'}"><b>${esc(n.level||'')}</b>缺口：${esc(n.gap)}</div><div class="question-chain"><div class="chain-box"><span>判断影响</span>${esc(n.impact)}</div><div class="chain-box"><span>建议追问 Q${i+1}</span>「${esc(n.question)}」</div></div>`).join('');
 const salesBox=state.user.role==='sales'?`<div class="comment-box"><label class="strong small-text">客户沟通后，把回复原话提交回系统</label><textarea placeholder="客户回复可粘贴回工作台「新建分析」，作为项目新材料留存"></textarea><div style="text-align:right;margin-top:10px"><button class="btn small" onclick="toast('请回到工作台粘贴客户回复并新建分析，回复会进入版本库')">知道了</button></div></div>`:'';
 return `<section class="panel"><h2 class="panel-title">信息缺口与客户追问</h2><p class="panel-sub">每个问题都说明为什么需要，而不是只给一张问题清单</p>${items}${salesBox}</section>`;
}
function auditBody(){return '<section class="panel"><h2 class="panel-title">人工修正留痕</h2><p class="panel-sub">保留 AI 原判断、人工判断和修改原因</p><div class="empty">修正留痕接口将在下一轮接入；当前报告均为草稿态，确认流转由产品经理线下完成。</div></section>'}

function chatPage(){
 const projs=askableProjects();
 if(!state.chatPid&&projs.length)state.chatPid=projs[0].id;
 if(!projs.length)return '<section class="panel"><div class="empty">材料问答依赖入库项目；请先在「新建分析」提交材料生成项目。</div></section>';
 const lastAi=[...state.chatMsgs].reverse().find(m=>m.from==='ai');
 const cites=(lastAi&&lastAi.cites||[]).map(c=>`<div class="ctx-item"><b>${esc(c.did||c.id||'')}</b>${esc(c.text||c.quote||'')}</div>`).join('')||'<div class="muted small-text" style="padding:8px 0">提问后，这里显示答案引用的原文段落</div>';
 return `<div class="page-head"><div><h1>材料问答</h1><p>只依据当前项目材料回答；依据不足时明确提示</p></div></div><div class="chat-layout"><section class="panel chat-panel"><div class="row" style="margin:0 0 14px"><span class="muted small-text">项目：</span><select onchange="setChatPid(this.value)" style="width:auto;min-width:200px">${projs.map(p=>`<option value="${esc(p.id)}" ${p.id===state.chatPid?'selected':''}>${esc(p.name)}</option>`).join('')}</select><span class="muted small-text">模式：</span><select onchange="setChatMode(this.value)" style="width:auto"><option value="mock" ${state.chatMode==='mock'?'selected':''}>离线演示（不调用 API）</option><option value="real" ${state.chatMode==='real'?'selected':''}>真实问答（调用 DeepSeek）</option></select><button class="btn secondary small" onclick="resetChat()">开新会话</button></div><div class="chat-log">${state.chatMsgs.length?state.chatMsgs.map(m=>`<div class="message ${m.from==='user'?'user':''}"><div class="bubble">${esc(m.text)}</div>${m.cites&&m.cites.length?`<div class="citations">${m.cites.map(c=>`<div>${esc((c.did||c.id||'')+' '+(c.text||c.quote||'')).slice(0,80)}</div>`).join('')}</div>`:''}${m.insufficient?'<div class="citations" style="border-color:#e0b4b4">依据不足，请补充材料后再确认</div>':''}</div>`).join(''):'<div class="empty">输入问题，或从右侧推荐问题开始。<br>回答会附带材料段落编号。</div>'}</div><div class="chat-input"><textarea id="question" placeholder="例如：客户最关心的问题是什么？" onkeydown="if(event.ctrlKey&&event.key==='Enter')sendQuestion()"></textarea><button class="btn" onclick="sendQuestion()" ${state.chatBusy?'disabled':''}>${state.chatBusy?'思考中…':'发送'}</button></div></section><aside><section class="panel"><h2 class="panel-title">可以这样问</h2><p class="panel-sub">围绕当前项目的真实材料</p><div class="suggestion" onclick="askSuggested('客户最关心的问题是什么？')">客户最关心的问题是什么？</div><div class="suggestion" onclick="askSuggested('哪些需求还没有足够依据？')">哪些需求还没有足够依据？</div><div class="suggestion" onclick="askSuggested('下次客户沟通应该问什么？')">下次客户沟通应该问什么？</div></section><section class="panel" style="margin-top:18px"><h2 class="panel-title">引用上下文</h2><p class="panel-sub">最近一次回答的依据</p>${cites}</section></aside></div>`;
}
function membersPage(){
 if(state.membersLoading)return '<div class="loading">成员加载中…</div>';
 const rows=state.members.map(m=>`<tr><td><div class="member-person"><div class="mini-avatar">${esc((m.name||'?').slice(0,1))}</div><div><b>${esc(m.name)}</b><span>${esc(m.email)}</span></div></div></td><td><select onchange="changeMemberRole('${esc(m.email)}',this.value)">${Object.entries(ROLE_NAMES).map(([k,v])=>`<option value="${k}" ${m.role===k?'selected':''}>${v}</option>`).join('')}</select></td><td class="muted small-text">${m.role==='admin'?'成员、角色与项目授权':m.role==='pm'?'分析、修正、确认和导出':m.role==='sales'?'提交材料与处理客户追问':'能力匹配查看与补充意见'}</td></tr>`).join('');
 return `<div class="page-head"><div><h1>成员与权限</h1><p>四种预设角色覆盖当前业务，不开放复杂自定义权限</p></div><div class="head-actions"><button class="btn" onclick="state.addOpen=!state.addOpen;render()">邀请成员</button></div></div>${state.addOpen?`<section class="panel" style="margin-bottom:20px"><h2 class="panel-title">添加成员</h2><p class="panel-sub">先指定角色；成员用分配的邮箱和初始密码登录</p><form onsubmit="event.preventDefault();addMember(this)"><div class="form-grid"><div class="field"><label>姓名</label><input class="input" name="name" required></div><div class="field"><label>角色</label><select class="input" name="role"><option value="sales">销售</option><option value="pm">产品经理</option><option value="presale">售前</option><option value="admin">管理员</option></select></div></div><div class="field"><label>工作邮箱</label><input class="input" name="email" type="email" required></div><div class="field"><label>初始密码</label><input class="input" name="password" type="password" minlength="8" required></div><button class="btn small" type="submit">添加成员</button></form></section>`:''}<div class="permission-grid"><section class="panel"><h2 class="panel-title">团队成员</h2><p class="panel-sub">角色决定操作边界；系统至少保留一名管理员</p><div class="table-wrap"><table><thead><tr><th>成员</th><th>角色</th><th>职责</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="muted">加载中</td></tr>'}</tbody></table></div></section><aside class="panel"><h2 class="panel-title">角色说明</h2><p class="panel-sub">业务确认权与系统管理权分离</p><div class="role-cards">${Object.entries(ROLE_NAMES).map(([k,v])=>`<div class="role-card"><h3>${v}</h3><p>${{admin:'账号、角色和项目授权',pm:'分析、修正、确认和导出',sales:'提交材料与处理客户追问',presale:'能力匹配查看与补充意见'}[k]}</p></div>`).join('')}</div></aside></div><section class="panel" style="margin-top:20px"><h2 class="panel-title">权限边界</h2><p class="panel-sub">固定矩阵，与后端校验一致</p><div class="table-wrap"><table><thead><tr><th>能力</th><th>管理员</th><th>产品经理</th><th>销售</th><th>售前</th></tr></thead><tbody><tr><td>上传材料 / 创建分析</td><td>—</td><td>允许</td><td>允许</td><td>—</td></tr><tr><td>查看报告</td><td>全部项目</td><td>全部项目</td><td>部分 · 追问</td><td>部分 · 匹配</td></tr><tr><td>修正与确认需求</td><td>—</td><td>允许</td><td>—</td><td>—</td></tr><tr><td>材料问答</td><td>—</td><td>允许</td><td>允许</td><td>允许</td></tr><tr><td>导出 Word</td><td>允许</td><td>允许</td><td>仅追问清单</td><td>允许</td></tr><tr><td>成员、角色与项目授权</td><td>允许</td><td>—</td><td>—</td><td>—</td></tr></tbody></table></div></section>`;
}
boot();
</script>
</body>
</html>
