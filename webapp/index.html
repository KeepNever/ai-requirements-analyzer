.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}.sidebar .brand{height:72px;padding:0 22px;border-bottom:1px solid var(--line);font-size:14px}.sidebar .brand-mark{width:31px;height:31px;font-size:14px;flex:none}.nav{padding:22px 14px;flex:1}.nav-label{font-size:10px;color:#9aa4b4;letter-spacing:.16em;padding:0 12px;margin:15px 0 7px}.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;margin:3px 0;border-radius:7px;color:#536176;cursor:pointer;font-size:13px}.nav-item:hover{background:var(--bg);color:var(--ink)}.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:600}.nav-dot{width:6px;height:6px;border:1.5px solid currentColor;border-radius:2px;flex:none}.nav-item.active .nav-dot{background:var(--blue);border-color:var(--blue)}.sidebar-foot{padding:16px 18px;border-top:1px solid var(--line)}.version{font-size:11px;color:#9aa4b4;margin-top:8px}.main{margin-left:var(--sidebar);min-height:100vh}.topbar{height:72px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:8}.breadcrumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:14px}.avatar{width:32px;height:32px;border-radius:50%;background:#202d49;color:#fff;display:grid;place-items:center;font-size:12px}.content{max-width:1380px;margin:0 auto;padding:32px 36px 64px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:26px}.page-head h1{font-size:25px;line-height:1.35;margin-bottom:5px}.page-head p{color:var(--muted);font-size:13px}.head-actions{display:flex;gap:10px;flex:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}.panel-title{font-size:15px;margin-bottom:4px}.panel-sub{font-size:12px;color:var(--muted);margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:18px 20px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:27px;line-height:1.3;margin:5px 0 2px;font-weight:650}.stat-note{font-size:11px;color:#8a95a7}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:500;background:#fafbfc;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 12px;white-space:nowrap}td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcff}.project-name{font-size:13px;font-weight:600;margin-bottom:2px}.todo-list{margin-top:12px}.todo{padding:14px 0;border-bottom:1px solid var(--line)}.todo:last-child{border-bottom:0}.todo b{font-size:12px;display:block;margin-bottom:3px}.todo p{font-size:12px;color:var(--muted)}.notice{padding:12px 15px;background:var(--blue-soft);border-radius:7px;color:#3151ae;font-size:12px;margin-bottom:20px}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:22px}.tab{padding:0 1px 11px;color:var(--muted);font-size:13px;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue);font-weight:600}.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.steps{display:flex;align-items:center;margin-bottom:24px}.step{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.step-num{width:25px;height:25px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff}.step.active{color:var(--blue);font-weight:600}.step.active .step-num{background:var(--blue);border-color:var(--blue);color:#fff}.step.done .step-num{background:var(--green);border-color:var(--green);color:#fff}.step-line{height:1px;background:var(--line);width:70px;margin:0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.upload-box{border:1px dashed #bdc8db;border-radius:9px;background:#fafbfe;padding:30px;text-align:center;margin:20px 0 16px;cursor:pointer}.upload-box:hover{border-color:var(--blue);background:var(--blue-soft)}.upload-title{font-weight:600;margin-bottom:4px}.upload-box p{font-size:12px;color:var(--muted)}textarea{resize:vertical;min-height:150px;line-height:1.7}.form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.cost{font-size:12px;color:var(--muted)}.clean-result{margin-top:20px;border-top:1px solid var(--line);padding-top:20px}.clean-stats{display:flex;gap:30px;margin:14px 0;flex-wrap:wrap}.clean-stats b{display:block;font-size:20px}.clean-stats span{font-size:11px;color:var(--muted)}.segment{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.segment b{color:var(--blue);margin-right:9px}
.report-head{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px}.report-title-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}.report-title-row h1{font-size:23px}.report-meta{display:flex;gap:20px;color:var(--muted);font-size:12px;flex-wrap:wrap}.report-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.evidence{border-left:3px solid #b7c5ef;background:#f8faff;padding:12px 15px;margin:14px 0;color:#4a5971;font-size:12px}.evidence b{color:var(--blue);margin-right:8px}.report-summary{font-size:14px;line-height:1.9;margin-bottom:20px}.side-section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}.side-section:last-child{border:0;margin:0;padding:0}.side-section h3{font-size:12px;margin-bottom:10px}.side-item{font-size:12px;color:var(--muted);padding:4px 0}.question-chain{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.chain-box{background:var(--bg);padding:13px;border-radius:7px;font-size:12px}.chain-box span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.comment-box{margin-top:16px}.comment-box textarea{min-height:80px}
.chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.chat-panel{min-height:610px;display:flex;flex-direction:column}.chat-log{flex:1;max-height:480px;overflow:auto;padding:4px 0 18px}.message{margin:16px 0;max-width:88%}.message.user{margin-left:auto;text-align:right}.bubble{display:inline-block;text-align:left;background:#f1f3f7;border-radius:9px;padding:11px 14px;font-size:13px;white-space:pre-wrap}.message.user .bubble{background:var(--blue);color:#fff}.citations{margin-top:8px;border-left:2px solid #bcc9ee;padding-left:11px;font-size:11px;color:var(--muted)}.chat-input{display:flex;gap:10px;border-top:1px solid var(--line);padding-top:16px}.chat-input textarea{min-height:62px;flex:1}.chat-input .btn{align-self:flex-end}.suggestion{padding:11px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--blue);cursor:pointer}.suggestion:last-child{border:0}
.permission-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role-card{border:1px solid var(--line);border-radius:8px;padding:15px}.role-card h3{font-size:13px;margin-bottom:4px}.role-card p{font-size:11px;color:var(--muted)}.member-person{display:flex;align-items:center;gap:9px}.mini-avatar{width:28px;height:28px;border-radius:50%;background:#edf1fa;color:#4d5d7a;display:grid;place-items:center;font-size:11px}.member-person b{display:block;font-size:12px}.member-person span{display:block;color:var(--muted);font-size:10px}.no-access{max-width:560px;margin:90px auto;text-align:center}.no-access h1{font-size:22px;margin-bottom:8px}.no-access p{color:var(--muted);margin-bottom:22px}
.modal-mask{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:60;display:grid;place-items:center}

.modal h2{font-size:18px;margin-bottom:4px}
.toast{position:fixed;right:26px;bottom:26px;background:#202b40;color:#fff;padding:11px 17px;border-radius:8px;font-size:12px;box-shadow:0 8px 30px rgba(20,30,50,.18);z-index:100;animation:toastin .2s ease}@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

@media(max-width:560px){.stats,.form-grid,.role-cards,.question-chain{grid-template-columns:1fr}.content{padding:20px 14px}.breadcrumb{display:none}.login-form-side{padding:28px}.steps{flex-wrap:wrap;gap:10px}.step-line{width:20px;margin:0 4px}.panel{padding:17px}.report-meta{flex-direction:column;gap:2px}}

<body>
<div id="root"></div>
<script>
const ROLE_PAGES={
 admin:['dashboard','report','members'],
 pm:['dashboard','new','report','chat','myquestions','caps'],
 sales:['dashboard','new','report','chat','myquestions'],
 presale:['dashboard','report','chat','caps']};
const ROLE_NAMES={admin:'管理员',pm:'产品经理',sales:'销售',presale:'售前'};
const ROLE_DESC={admin:'账号、角色和项目授权',pm:'分析、修正、确认和导出',sales:'提交材料与处理客户追问',presale:'能力匹配查看与补充意见'};
const PAGE_NAMES={dashboard:'项目工作台',new:'新建分析',report:'分析报告',chat:'材料问答',members:'成员与权限',eval:'质量评测',myquestions:'我的追问',caps:'能力匹配'};
const NAV_GROUPS=[['日常工作',[['dashboard','项目工作台'],['new','新建分析'],['myquestions','我的追问'],['chat','材料问答'],['caps','能力匹配']]],['组织管理',[['members','成员与权限']]]];
const VERDICT_CLASS={'匹配':'green','部分匹配':'amber','待确认':'gray','不支持':'red'};
const state={booting:true,user:null,page:'dashboard',overview:[],overviewLoading:true,
 projectView:'projects',versionPid:'',versions:null,
 reportId:'',report:null,reportLoading:false,reportTab:'needs',
 scene:'presale',material:'',clean:null,cleanLoading:false,running:false,
 chatPid:'',chatMode:'mock',chatConv:'',chatMsgs:[],chatBusy:false,
 members:[],membersLoading:false,addOpen:false,
 myQuestions:[],mqLoading:false,replyFor:null,
 caps:[],capsLoading:false,capsFilter:'全部',noteFor:null,
 confirmFor:null,confirmNote:'',reportNotes:null,modelInfo:null,modelOpen:false,accessData:null,scenes:null,customSpec:null,customDesigning:false};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function can(p){return !!(state.user&&ROLE_PAGES[state.user.role]&&ROLE_PAGES[state.user.role].includes(p))}

async function api(path,opts={}){
 const init={method:opts.method||'GET',headers:{'X-Requested-With':'XMLHttpRequest'}};
 if(opts.body!==undefined){init.headers['Content-Type']='application/json';init.body=JSON.stringify(opts.body)}
 const r=await fetch(path,init);
 let data={};try{data=await r.json()}catch(e){}
 if(r.status===401){state.user=null;state.page='login';render();throw new Error(data.error||'未登录')}
 if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
 return data;
}

function routeHash(){
 if(!state.user)return false;
 const h=location.hash.replace('#','');
 const allowed={dashboard:'dashboard',new:'new',chat:'chat',members:'members',eval:'eval',myquestions:'myquestions',caps:'caps'};
 const target=allowed[h];
 const ok=!!target&&(target==='eval'?can('dashboard'):can(target));
 if(ok){
  state.page=target;
  try{history.replaceState(null,'','#'+target)}catch(e){}
  if(target==='dashboard')loadOverview();
  if(target==='chat'&&!state.overview.length)loadOverview(false);
  if(target==='members')loadMembers();
  render();window.scrollTo(0,0);
 }else if(h){
  try{history.replaceState(null,'','#'+state.page)}catch(e){}
 }
 return ok;
}
window.addEventListener('hashchange',()=>{if(state.user&&!state.booting)routeHash()});
async function boot(){
 try{
  state.user=await api('/api/me');
  if(!routeHash())state.page=state.user.role==='admin'?'members':'dashboard';
  await loadOverview(false);
  try{state.scenes=await api('/api/scenes')}catch(e){}
  if(state.page==='members'){loadMembers();loadAccess();}
 }catch(e){state.page='login'}
 state.booting=false;render();
}
async function loadOverview(spinner=true){
 if(spinner){state.overviewLoading=true;render()}
 try{state.overview=await api('/api/overview')}catch(e){if(state.user)toast('加载项目失败：'+e.message)}
 state.overviewLoading=false;
}
function askableProjects(){return state.overview.filter(x=>x.source==='project')}

function pageAfterLogin(){
 const h=location.hash.replace('#','');
 const allowed={dashboard:'dashboard',new:'new',chat:'chat',members:'members',eval:'eval',myquestions:'myquestions',caps:'caps'};
 if(h&&allowed[h]&&(allowed[h]==='eval'?can('dashboard'):can(allowed[h])))return allowed[h];
 return state.user.role==='admin'?'members':'dashboard';
}
async function doLogin(form){
 const f=new FormData(form);
 try{
  state.user=await api('/api/auth/login',{method:'POST',body:{email:f.get('email'),password:f.get('password')}});
  state.page=pageAfterLogin();await loadOverview(false);
  if(state.page==='members'){loadMembers();loadAccess();}
  try{state.scenes=await api('/api/scenes')}catch(e){}
 }catch(e){showAuthError(e.message);return}
 render();
}
async function doRegister(form){
 const f=new FormData(form);
 if(f.get('password')!==f.get('password2')){showAuthError('两次输入的密码不一致');return}
 try{
  state.user=await api('/api/auth/register',{method:'POST',body:{name:f.get('name'),org:f.get('org'),email:f.get('email'),password:f.get('password')}});
  state.page=pageAfterLogin();await loadOverview(false);
  if(state.page==='members'){loadMembers();loadAccess();}
  try{state.scenes=await api('/api/scenes')}catch(e){}
 }catch(e){showAuthError(e.message);return}
 render();toast('团队创建成功，你已成为管理员');
}
async function doLogout(){
 try{await api('/api/auth/logout',{method:'POST'})}catch(e){}
 state.user=null;state.page='login';render();
}
function showAuthError(msg){const el=document.getElementById('authError');if(el){el.textContent=msg;el.classList.remove('hidden')}}

function go(page){
 const gate=page==='eval'?'dashboard':page;
 if(!can(gate)){toast('当前角色没有此页面权限');return}
 state.page=page;
 try{history.replaceState(null,'','#'+page)}catch(e){}
 if(page==='dashboard')loadOverview();
 if(page==='chat'&&!state.overview.length)loadOverview(false);
 if(page==='members'){loadMembers();loadAccess();}
 if(page==='myquestions')loadMyQuestions();
 if(page==='caps')loadCaps();
 render();window.scrollTo(0,0);
}
function setProjectView(v){state.projectView=v;render()}
function setReportTab(k){state.reportTab=k;render()}
function setScene(v){state.scene=v;render()}
function setMaterial(v){state.material=v}
function setChatPid(v){state.chatPid=v;state.chatConv='';state.chatMsgs=[];render()}
function setChatMode(v){state.chatMode=v;state.chatConv='';render()}
function resetChat(){state.chatConv='';state.chatMsgs=[];render()}

async function doClean(){
 if(!state.material.trim()){toast('请先粘贴或上传材料');return}
 state.cleanLoading=true;render();
 try{state.clean=await api('/api/clean',{method:'POST',body:{material:state.material}})}
 catch(e){toast('清洗失败：'+e.message)}
 state.cleanLoading=false;render();
}
async function doRun(){
 if(!state.material.trim()){toast('请先粘贴或上传材料');return}
 if(state.scene==='custom'&&!state.customSpec){toast('请先设计并确认输出结构');return}
 state.running=true;render();
 try{
  const body={material:state.material,scene:state.scene};
  if(state.scene==='custom'){body.custom_spec=state.customSpec;body.requirement=(state.customReq||'').trim();}
  const r=await api('/run-text',{method:'POST',body});
  state.running=false;state.clean=null;state.material='';
  toast('分析完成');
  openReport(r.case);
 }catch(e){state.running=false;toast('分析失败：'+e.message);render()}
}

 }

async function openReport(id){
 state.reportId=id;state.report=null;state.reportLoading=true;state.page='report';
 const tabs=reportTabs();state.reportTab=tabs[0].key;
 render();
 try{state.report=await api('/api/report/'+encodeURIComponent(id))}

 if(state.report&&!state.report.error){

function reportScene(){
 if(state.report&&state.report.render_spec)return 'generic';
 return 'presale';
}
function reportTabs(){
 const spec=state.report&&state.report.render_spec;
 if(reportScene()==='generic'&&spec){
  const tabs=(spec.sections||[]).map(sec=>({key:sec.key,label:String(sec.word_title||sec.key).replace(/^[一二三四五六七八九十]+、/,'')}));
  if(spec.actions_section)tabs.push({key:spec.actions_section.key,label:String(spec.actions_section.word_title||spec.actions_section.key).replace(/^[一二三四五六七八九十]+、/,'')});
  if(state.user.role!=='sales')tabs.push({key:'audit',label:'修正记录'});
  return tabs;
 }
 if(state.user.role==='sales')return[{key:'questions',label:'待确认与追问'}];
 if(state.user.role==='presale')return[{key:'capability',label:'能力匹配'},{key:'questions',label:'待确认信息'}];
 return[{key:'needs',label:'需求分析'},{key:'capability',label:'能力匹配'},{key:'questions',label:'待确认追问'},{key:'audit',label:'修正记录'}];
}
async function askSuggested(text){
 const box=document.getElementById('question');if(box)box.value=text;
 await sendQuestion();
}
async function sendQuestion(){
 const box=document.getElementById('question');
 const q=(box?box.value:'').trim();
 if(!q){toast('请输入问题');return}
 if(!state.chatPid){toast('请先选择项目');return}
 if(state.chatBusy)return;
 state.chatMsgs.push({from:'user',text:q});state.chatBusy=true;box.value='';render();
 try{
  const r=await api('/api/ask',{method:'POST',body:{project_id:state.chatPid,question:q,mock:state.chatMode==='mock',conversation_id:state.chatConv||null}});
  state.chatConv=r.conversation_id||state.chatConv;
  state.chatMsgs.push({from:'ai',text:r.answer,cites:r.frontend_citations||[],insufficient:!r.sufficient});
 }catch(e){state.chatMsgs.push({from:'ai',text:'出错了：'+e.message})}
 state.chatBusy=false;render();
 const log=document.querySelector('.chat-log');if(log)log.scrollTop=log.scrollHeight;
}

function esc2(v){return String(v==null?'':v).replace(/\|/g,'\\|').replace(/\n/g,' ')}
function mdTable(headers, rows){

function exportMarkdown(){
 const r=state.report, a=r.analysis||{};
 let md='# '+r.name+' · 分析报告\n\n';
 md+='> 运行 '+(r.run_id||'')+' · AI 草稿，结论需人工确认后使用\n\n';
 const spec=r.render_spec;
 if(reportScene()==='generic'&&spec){
  const secs=(spec.sections||[]).concat(spec.actions_section?[spec.actions_section]:[]);
  let num=0;
  for(const sec of secs){
   num+=1;
   const title=String(sec.word_title||sec.key).replace(/^[一二三四五六七八九十]+、/,'');
   const items=a[sec.key]||[];
   md+='## '+num+'、'+title+'\n\n';
   if(!items.length){md+=(sec.empty_text||'（无数据）')+'\n\n';continue}
   if(sec.render==='bullet'){
    md+=items.map((it,i)=>{
     const dids=(it.dids||[]).join('、');
     const vars=Object.assign({},it,{dids});
     let text=String(sec.bullet_template||'- {issue}');
     Object.keys(vars).forEach(k=>{text=text.split('{'+k+'}').join(esc2(vars[k]))});
     return text.replace(/\{[^}]+\}/g,'—');
    }).join('\n')+'\n\n';
   }else{
    md+=mdTable((sec.columns||[]).map(c=>c.header),
     items.map(it=>(sec.columns||[]).map(c=>c.field==='_dids'?esc2((it.dids||[]).join('、')||'—'):esc2(it[c.field]==null?'—':it[c.field]))))+'\n\n';
   }
  }
  if(a.summary)md='> '+esc2(a.summary)+'\n\n'+md;
 } else {
  const n1=a.node1||{},n2=a.node2||{},pri=a.priority||[];
  const tierMap={};pri.forEach(x=>{tierMap[x.id]=x.tier});
  md+='## 一、显性需求\n\n'+mdTable(['编号','需求','优先级','状态'],
   (n1.explicit_needs||[]).map(n=>[esc2(n.id),esc2(n.content),esc2(tierMap[n.id]||'—'),(state.reportNotes&&state.reportNotes.needs&&state.reportNotes.needs[n.id])?'已确认':'草稿']))+'\n\n';
  md+='## 二、潜在需求（推断）\n\n'+mdTable(['编号','需求','推断线索','置信度'],
   (n2.potential_needs||[]).map(n=>[esc2(n.id),esc2(n.content),esc2(n.inference||n.rationale||''),esc2(n.confidence||'')]))+'\n\n';
  md+='## 三、能力匹配\n\n'+mdTable(['匹配对象','结论','依据'],
   (n2.capability_match||[]).map(c=>[esc2(c.target),esc2(c.verdict),esc2(c.reason||'')]))+'\n\n';
  md+='## 四、待确认与追问\n\n'+((n2.pending_confirmations||[]).map((q,i)=>(i+1)+'. 【'+(q.level||'')+'】缺口：'+esc2(q.gap)+'\n   - 影响：'+esc2(q.impact)+'\n   - 建议追问：'+esc2(q.question)).join('\n')||'无')+'\n\n';
 }
 md+='---\n\n*由 AI 客户需求分析助手导出 · 草稿态内容，使用前需人工确认*\n';
 const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
 const el=document.createElement('a');
 el.href=URL.createObjectURL(blob);
 el.download=r.name+'_分析报告.md';
 el.click();URL.revokeObjectURL(el.href);
 toast('Markdown 已导出');
}

 }else if(sec.render==='bullet'){

function needsBody(a){

 const pnRows=pn.map(n=>`<tr><td class="strong">${esc(n.id)}</td><td>${esc(n.content)}</td><td class="muted">${esc(n.reasoning||'')}</td><td>${esc(n.confidence||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">无</td></tr>';

  const replyBlock=rec?`<div class="evidence" style="margin-top:10px"><b>客户回复</b>${esc(rec.reply)}（${esc(rec.by_name||'')} · ${esc(rec.at||'')}）</div>`
   :(isSales?(state.replyFor===i?`<div class="comment-box"><textarea id="replyText" placeholder="粘贴客户对这条追问的原话回复"></textarea><div style="text-align:right;margin-top:10px"><button class="btn small" onclick="submitReplyReport(${i})">提交回复</button> <button class="btn secondary small" onclick="state.replyFor=null;render()">取消</button></div></div>`:`<button class="btn secondary small" onclick="state.replyFor=${i};render()">录入客户回复</button>`):'');
  return `<div class="evidence" style="margin-top:${i?'18px':'14px'}"><b>${esc(n.level||'')}</b>缺口：${esc(n.gap)}</div><div class="question-chain"><div class="chain-box"><span>判断影响</span>${esc(n.impact)}</div><div class="chain-box"><span>建议追问 Q${i+1}</span>「${esc(n.question)}」</div></div>${replyBlock}`;
 }).join('');
 return `<section class="panel"><h2 class="panel-title">信息缺口与客户追问</h2><p class="panel-sub">每个问题都说明为什么需要；${isSales?'录入回复后产品经理同步可见':'销售录入的回复自动留痕'}</p>${items}</section>`;
}
function auditBody(){
 const list=(state.reportNotes&&state.reportNotes.audit)||[];
 const rows=list.map(e=>`<div class="audit"><b>${esc(e.type)} · ${esc(e.title)}</b><p>${esc(e.detail||'')}</p><span>${esc(e.by||'')} · ${esc(e.at||'')}</span></div>`).join('');
 return `<section class="panel"><h2 class="panel-title">人工修正留痕</h2><p class="panel-sub">确认流转、客户回复、售前意见全部追加式留痕，不覆盖历史</p>${rows||'<div class="empty">暂无修正记录；产品确认需求、销售录入回复、售前补充意见后会自动留痕。</div>'}</section>`;
}

function chatPage(){
 const projs=askableProjects();
 if(!state.chatPid&&projs.length)state.chatPid=projs[0].id;
 if(!projs.length)return '<section class="panel"><div class="empty">材料问答依赖入库项目；请先在「新建分析」提交材料生成项目。</div></section>';
 const lastAi=[...state.chatMsgs].reverse().find(m=>m.from==='ai');
 const cites=(lastAi&&lastAi.cites||[]).map(c=>`<div class="ctx-item"><b>${esc(c.did||c.id||'')}</b>${esc(c.text||c.quote||'')}</div>`).join('')||'<div class="muted small-text" style="padding:8px 0">提问后，这里显示答案引用的原文段落</div>';
 return `<div class="page-head"><div><h1>材料问答</h1><p>只依据当前项目材料回答；依据不足时明确提示</p></div></div><div class="chat-layout"><section class="panel chat-panel"><div class="row" style="margin:0 0 14px"><span class="muted small-text">项目：</span><select onchange="setChatPid(this.value)" style="width:auto;min-width:200px">${projs.map(p=>`<option value="${esc(p.id)}" ${p.id===state.chatPid?'selected':''}>${esc(p.name)}</option>`).join('')}</select><span class="muted small-text">模式：</span><select onchange="setChatMode(this.value)" style="width:auto"><option value="mock" ${state.chatMode==='mock'?'selected':''}>离线演示（不调用 API）</option><option value="real" ${state.chatMode==='real'?'selected':''}>真实问答（调用 DeepSeek）</option></select><button class="btn secondary small" onclick="resetChat()">开新会话</button></div><div class="chat-log">${state.chatMsgs.length?state.chatMsgs.map(m=>`<div class="message ${m.from==='user'?'user':''}"><div class="bubble">${esc(m.text)}</div>${m.cites&&m.cites.length?`<div class="citations">${m.cites.map(c=>`<div>${esc((c.did||c.id||'')+' '+(c.text||c.quote||'')).slice(0,80)}</div>`).join('')}</div>`:''}${m.insufficient?'<div class="citations" style="border-color:#e0b4b4">依据不足，请补充材料后再确认</div>':''}</div>`).join(''):'<div class="empty">输入问题，或从右侧推荐问题开始。<br>回答会附带材料段落编号。</div>'}</div><div class="chat-input"><textarea id="question" placeholder="例如：客户最关心的问题是什么？" onkeydown="if(event.ctrlKey&&event.key==='Enter')sendQuestion()"></textarea><button class="btn" onclick="sendQuestion()" ${state.chatBusy?'disabled':''}>${state.chatBusy?'思考中…':'发送'}</button></div></section><aside><section class="panel"><h2 class="panel-title">可以这样问</h2><p class="panel-sub">围绕当前项目的真实材料</p><div class="suggestion" onclick="askSuggested('客户最关心的问题是什么？')">客户最关心的问题是什么？</div><div class="suggestion" onclick="askSuggested('哪些需求还没有足够依据？')">哪些需求还没有足够依据？</div><div class="suggestion" onclick="askSuggested('下次客户沟通应该问什么？')">下次客户沟通应该问什么？</div></section><section class="panel" style="margin-top:18px"><h2 class="panel-title">引用上下文</h2><p class="panel-sub">最近一次回答的依据</p>${cites}</section></aside></div>`;
}
function evalPage(){
 return `<div class="page-head"><div><h1>质量评测</h1><p>评测驱动迭代 · 六指标四数据集，与工作台同源</p></div><div class="head-actions"><button class="btn secondary" onclick="window.open('/dashboard','_blank')">新窗口打开</button></div></div><iframe src="/dashboard?embed=1" style="width:100%;height:calc(100vh - 210px);min-height:560px;border:1px solid var(--line);border-radius:10px;background:#fff"></iframe>`;
}
async function loadMyQuestions(){state.mqLoading=true;render();try{state.myQuestions=await api('/api/my-questions')}catch(e){toast('加载失败：'+e.message)}state.mqLoading=false;render()}
function qCard(q,idx,done){
 const replyForm=!done&&state.user.role==='sales'?(state.replyFor===('mq'+idx)?`<div class="comment-box"><textarea id="replyText" placeholder="粘贴客户对这条追问的原话回复"></textarea><div style="text-align:right;margin-top:10px"><button class="btn small" onclick="submitReplyMine(${idx})">提交回复</button> <button class="btn secondary small" onclick="state.replyFor=null;render()">取消</button></div></div>`:`<button class="btn secondary small" onclick="state.replyFor='mq${idx}';render()">录入回复</button>`):'';
 return `<div class="todo" style="padding:16px 0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="margin:0">${esc(q.name)}</b><span class="pill ${q.level==='决定性'?'red':'amber'}">${esc(q.level)}</span>${done?pill('已回复','green'):pill('待追问','amber')}</div><div class="evidence" style="margin:10px 0"><b>缺口</b>${esc(q.gap)}</div><div class="chain-box"><span>判断影响</span>${esc(q.impact)}</div><div class="chain-box" style="margin-top:10px"><span>建议追问</span>「${esc(q.question)}」</div>${done&&q.reply?`<div class="evidence" style="margin-top:10px"><b>客户回复</b>${esc(q.reply)}（${esc(q.reply_by||'')} · ${esc(q.reply_at||'')}）</div>`:''}${replyForm}</div>`;
}
function myQuestionsPage(){
 if(state.mqLoading)return '<div class="loading">追问加载中…</div>';
 const list=state.myQuestions||[];
 const open=list.filter(x=>!x.answered),done=list.filter(x=>x.answered);
 return `<div class="page-head"><div><h1>我的追问</h1><p>跨项目汇总所有待确认问题，决定性缺口排前；客户沟通后在此录入回复，产品经理同步可见</p></div></div>${list.length?'':`<section class="panel"><div class="empty">当前没有待确认问题。</div></section>`}${open.length?`<section class="panel"><h2 class="panel-title">待追问（${open.length}）</h2>${open.map(q=>qCard(q,list.indexOf(q),false)).join('')}</section>`:''}${done.length?`<section class="panel"><h2 class="panel-title">已回复（${done.length}）</h2>${done.map(q=>qCard(q,list.indexOf(q),true)).join('')}</section>`:''}`;
}
async function submitReplyMine(idx){
 const q=state.myQuestions[idx];
 const box=document.getElementById('replyText');const reply=box?box.value.trim():'';
 if(!reply){toast('请填写客户回复');return}
 try{await api('/api/notes/'+q.source+'/'+encodeURIComponent(q.id)+'/reply',{method:'POST',body:{gap:q.gap,question:q.question,reply}});toast('回复已登记，产品经理可见');state.replyFor=null;loadMyQuestions();}
 catch(e){toast('提交失败：'+e.message)}
}
async function submitReplyReport(i){
 const pend=(state.report.questions)||(state.report.analysis.node2.pending_confirmations);
 const q=pend[i];
 const box=document.getElementById('replyText');const reply=box?box.value.trim():'';
 if(!reply){toast('请填写客户回复');return}
 try{await api('/api/notes/'+state.report.source+'/'+encodeURIComponent(state.report.name)+'/reply',{method:'POST',body:{gap:q.gap,question:q.question,reply}});toast('回复已登记');state.replyFor=null;openReport(state.reportId);}
 catch(e){toast('提交失败：'+e.message)}
}
async function confirmNeed(needId){
 const note=(state.confirmNote||'').trim();
 try{await api('/api/notes/'+state.report.source+'/'+encodeURIComponent(state.report.name)+'/confirm',{method:'POST',body:{need_id:needId,note}});toast(needId+' 已确认入库，留痕完成');state.confirmFor=null;openReport(state.reportId);}
 catch(e){toast('确认失败：'+e.message)}
}
async function loadCaps(){state.capsLoading=true;render();try{state.caps=await api('/api/capability-review')}catch(e){toast('加载失败：'+e.message)}state.capsLoading=false;render()}
function capCard(x,i,canNote){
 const noteForm=state.noteFor===('cap'+i)?`<div class="comment-box"><textarea id="noteText" placeholder="能力边界、实现条件或方案建议"></textarea><div style="text-align:right;margin-top:10px"><button class="btn small" onclick="submitNote(${i})">保存意见</button> <button class="btn secondary small" onclick="state.noteFor=null;render()">取消</button></div></div>`:(canNote?`<button class="btn secondary small" onclick="state.noteFor='cap${i}';render()">补充意见</button>`:'');
 return `<div class="todo" style="padding:16px 0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="margin:0">${esc(x.name)}</b>${pill(x.verdict,VERDICT_CLASS[x.verdict]||'gray')}</div><div class="muted small-text" style="margin:6px 0">匹配对象：${esc(x.target)}</div><div class="evidence" style="margin:6px 0"><b>AI 依据</b>${esc(x.reason)}</div>${(x.notes||[]).map(n=>`<div class="evidence" style="margin-top:8px"><b>售前意见</b>${esc(n.note)}（${esc(n.by_name||'')} · ${esc(n.at||'')}）</div>`).join('')}${noteForm}</div>`;
}
function capsPage(){
 if(state.capsLoading)return '<div class="loading">能力匹配加载中…</div>';
 const all=state.caps||[],fl=state.capsFilter;
 const list=fl==='全部'?all:all.filter(x=>x.verdict===fl);
 const canNote=state.user.role==='presale'||state.user.role==='pm';
 return `<div class="page-head"><div><h1>能力匹配复核</h1><p>跨项目汇总非「匹配」结论；售前在此补充方案意见，意见全员可见并留痕</p></div></div><div class="tabs">${['全部','部分匹配','待确认','不支持'].map(v=>`<div class="tab ${fl===v?'active':''}" onclick="state.capsFilter='${v}';render()">${v}</div>`).join('')}</div>${list.length?`<section class="panel">${list.map((x,i)=>capCard(x,all.indexOf(x),canNote)).join('')}</section>`:`<section class="panel"><div class="empty">${fl==='全部'?'当前没有能力匹配数据。':'该分类下暂无条目。'}</div></section>`}`;
}
async function submitNote(i){
 const x=state.caps[i];
 const box=document.getElementById('noteText');const note=box?box.value.trim():'';
 if(!note){toast('请填写意见内容');return}
 try{await api('/api/notes/'+x.source+'/'+encodeURIComponent(x.id)+'/presale-note',{method:'POST',body:{target:x.target,verdict:x.verdict,note}});toast('意见已保存并留痕');state.noteFor=null;loadCaps();}
 catch(e){toast('保存失败：'+e.message)}
}
function membersPage(){
 if(state.membersLoading)return '<div class="loading">成员加载中…</div>';
 const rows=state.members.map(m=>`<tr><td><div class="member-person"><div class="mini-avatar">${esc((m.name||'?').slice(0,1))}</div><div><b>${esc(m.name)}</b><span>${esc(m.email)}</span></div></div></td><td><select onchange="changeMemberRole('${esc(m.email)}',this.value)">${Object.entries(ROLE_NAMES).map(([k,v])=>`<option value="${k}" ${m.role===k?'selected':''}>${v}</option>`).join('')}</select></td><td class="muted small-text">${m.role==='admin'?'成员、角色与项目授权':m.role==='pm'?'分析、修正、确认和导出':m.role==='sales'?'提交材料与处理客户追问':'能力匹配查看与补充意见'}</td></tr>`).join('');
 return `<div class="page-head"><div><h1>${state.user.role==='admin'?'管理控制台':'成员与权限'}</h1><p>${state.user.role==='admin'?'邀请企业成员、分配角色；业务确认权与系统管理权分离，至少保留一名管理员':'四种预设角色覆盖当前业务，不开放复杂自定义权限'}</p></div><div class="head-actions"><button class="btn" onclick="state.addOpen=!state.addOpen;render()">邀请成员</button></div></div>${state.addOpen?`<section class="panel" style="margin-bottom:20px"><h2 class="panel-title">添加成员</h2><p class="panel-sub">先指定角色；成员用分配的邮箱和初始密码登录</p><form onsubmit="event.preventDefault();addMember(this)"><div class="form-grid"><div class="field"><label>姓名</label><input class="input" name="name" required></div><div class="field"><label>角色</label><select class="input" name="role"><option value="sales">销售</option><option value="pm">产品经理</option><option value="presale">售前</option><option value="admin">管理员</option></select></div></div><div class="field"><label>工作邮箱</label><input class="input" name="email" type="email" required></div><div class="field"><label>初始密码</label><input class="input" name="password" type="password" minlength="8" required></div><button class="btn small" type="submit">添加成员</button></form></section>`:''}<div class="permission-grid"><section class="panel"><h2 class="panel-title">团队成员</h2><p class="panel-sub">角色决定操作边界；系统至少保留一名管理员</p><div class="table-wrap"><table><thead><tr><th>成员</th><th>角色</th><th>职责</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="muted">加载中</td></tr>'}</tbody></table></div></section><aside class="panel"><h2 class="panel-title">角色说明</h2><p class="panel-sub">业务确认权与系统管理权分离</p><div class="role-cards">${Object.entries(ROLE_NAMES).map(([k,v])=>`<div class="role-card"><h3>${v}</h3><p>${{admin:'账号、角色和项目授权',pm:'分析、修正、确认和导出',sales:'提交材料与处理客户追问',presale:'能力匹配查看与补充意见'}[k]}</p></div>`).join('')}</div></aside></div><section class="panel" style="margin-top:20px"><h2 class="panel-title">权限边界</h2><p class="panel-sub">固定矩阵，与后端校验一致</p><div class="table-wrap"><table><thead><tr><th>能力</th><th>管理员</th><th>产品经理</th><th>销售</th><th>售前</th></tr></thead><tbody><tr><td>上传材料 / 创建分析</td><td>—</td><td>允许</td><td>允许</td><td>—</td></tr><tr><td>查看报告</td><td>全部项目</td><td>全部项目</td><td>部分 · 追问</td><td>部分 · 匹配</td></tr><tr><td>修正与确认需求</td><td>—</td><td>允许</td><td>—</td><td>—</td></tr><tr><td>材料问答</td><td>—</td><td>允许</td><td>允许</td><td>允许</td></tr><tr><td>导出 Word</td><td>允许</td><td>允许</td><td>仅追问清单</td><td>允许</td></tr><tr><td>成员、角色与项目授权</td><td>允许</td><td>—</td><td>—</td><td>—</td></tr></tbody></table></div></div></section>${accessPanel()}`;
}
function accessPanel(){
 if(!state.accessData)return '<section class="panel" style="margin-top:20px"><div class="loading">项目授权加载中…</div></section>';
 const ad=state.accessData;
 const salesPresale=(ad.members||[]).filter(m=>m.role==='sales'||m.role==='presale');
 const rows=(ad.projects||[]).map(p=>{
  const restricted=(ad.restricted||[]).includes(p.id);
  const grants=(ad.grants||{})[p.id]||[];
  const grantChips=salesPresale.map(m=>{
    const on=grants.includes(m.user_id);
    return `<label class="check" style="margin-right:12px;font-size:12px"><input type="checkbox" ${on?'checked':''} onchange="toggleGrant('${esc(p.id)}','${esc(m.user_id)}',this.checked)"> ${esc(m.name)}</label>`;
  }).join('');
  return `<div class="todo" style="padding:14px 0"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="margin:0">${esc(p.name)}</b><span class="pill ${p.source==='project'?'blue':'gray'}">${p.source==='project'?'项目':'案例'}</span><label class="check" style="margin-left:auto"><input type="checkbox" ${restricted?'checked':''} onchange="toggleAccess('${esc(p.id)}',this.checked)"> 受限访问</label></div>${restricted?`<div style="margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:7px"><span class="muted small-text">可见成员（销售/售前，管理员与产品经理恒可见）：</span>${grantChips||'<span class="muted small-text">暂未授权任何成员</span>'}</div>`:''}</div>`;
 }).join('');
 return `<section class="panel" style="margin-top:20px"><h2 class="panel-title">项目访问控制</h2><p class="panel-sub">默认全员可见；开启受限后仅管理员、产品经理与被授权成员可见</p>${rows||'<div class="empty">暂无项目</div>'}</section>`;
}
boot();
</script>
</body>
</html>
