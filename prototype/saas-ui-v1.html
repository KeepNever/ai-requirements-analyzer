<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>AI 客户需求分析助手 · SaaS 界面原型 V1</title>
<!--
设计假设：
1. 本稿只验证信息架构、角色视图和关键交互，不实现真实登录、鉴权或数据写入。
2. 沿用现有产品的克莱因蓝与中文无衬线字体；不引入新品牌体系。
3. 四种预设角色：管理员、产品经理、销售、售前；不做自定义 RBAC 权限组合。
4. 项目资料库收进工作台，报告按角色拆页签，评测 Dashboard 保留为独立管理入口。
-->
<style>
:root{--blue:#2b5cff;--blue-dark:#1f46c8;--blue-soft:#eef2ff;--ink:#1c2536;--muted:#68758a;--line:#e3e8f0;--bg:#f5f7fb;--panel:#fff;--green:#16855c;--green-soft:#eaf7f1;--amber:#a96300;--amber-soft:#fff6e6;--red:#c4404e;--red-soft:#fff0f1;--sidebar:232px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.btn{border:0;border-radius:7px;background:var(--blue);color:#fff;padding:10px 18px;font-weight:600;transition:.18s}.btn:hover{background:var(--blue-dark)}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.secondary:hover{border-color:var(--blue);color:var(--blue)}.btn.small{padding:6px 12px;font-size:12px}.btn.text{background:transparent;color:var(--blue);padding:5px 8px}.btn:disabled{background:#aab6d2;cursor:not-allowed}.link{color:var(--blue);text-decoration:none;cursor:pointer}.muted{color:var(--muted)}.small-text{font-size:12px}.strong{font-weight:600}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap}.pill.blue{background:var(--blue-soft);color:var(--blue)}.pill.green{background:var(--green-soft);color:var(--green)}.pill.amber{background:var(--amber-soft);color:var(--amber)}.pill.gray{background:#eef1f5;color:var(--muted)}.pill.red{background:var(--red-soft);color:var(--red)}
/* 登录 */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(420px,1.12fr) minmax(440px,.88fr);background:#fff}.login-story{position:relative;overflow:hidden;background:#173da8;color:#fff;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}.login-story:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}.brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;letter-spacing:.02em}.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:700}.login-story .brand-mark{background:#fff;color:#173da8}.story-main{position:relative;z-index:1;max-width:600px}.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#b9caff;margin-bottom:20px}.story-main h1{font-size:42px;line-height:1.28;letter-spacing:-.03em;margin-bottom:18px;font-weight:650}.story-main>p{color:#d6dfff;font-size:16px;max-width:470px}.evidence-flow{margin-top:48px;background:rgba(8,27,86,.35);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:22px 24px;backdrop-filter:blur(4px)}.flow-quote{font-size:14px;color:#fff}.flow-quote b{color:#cbd8ff;margin-right:9px}.flow-line{height:1px;background:rgba(255,255,255,.16);margin:17px 0}.flow-result{display:grid;grid-template-columns:1fr 1fr;gap:20px}.flow-result span{display:block;color:#aebfef;font-size:11px;margin-bottom:5px}.flow-result b{font-size:13px;font-weight:500}.login-foot{position:relative;z-index:1;color:#aebfef;font-size:12px}.login-form-side{display:grid;place-items:center;padding:48px}.login-form{width:100%;max-width:400px}.login-form h2{font-size:28px;margin-bottom:8px}.login-form .sub{color:var(--muted);margin-bottom:34px}.field{margin-bottom:18px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}.input,select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:10px 12px;outline:none;transition:.15s}.input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,92,255,.09)}.password-row{display:flex;justify-content:space-between;align-items:center}.login-options{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px;color:var(--muted);font-size:12px}.check{display:flex;gap:7px;align-items:center}.check input{accent-color:var(--blue)}.login-submit{width:100%;padding:12px}.demo-note{margin-top:20px;padding:12px 14px;background:var(--bg);border-radius:7px;color:var(--muted);font-size:12px}.auth-switch{text-align:center;margin-top:22px;font-size:13px;color:var(--muted)}.auth-switch a{margin-left:6px}.password-hint{font-size:11px;color:var(--muted);margin-top:5px}.register-form{max-width:440px}.register-form .form-grid{gap:0 14px}.register-form .login-form{margin:32px 0}.login-meta{margin-top:28px;text-align:center;color:#97a1b2;font-size:11px}
/* 应用框架 */
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10}.sidebar .brand{height:72px;padding:0 22px;border-bottom:1px solid var(--line);font-size:14px}.sidebar .brand-mark{width:31px;height:31px;font-size:14px;flex:none}.nav{padding:22px 14px;flex:1}.nav-label{font-size:10px;color:#9aa4b4;letter-spacing:.16em;padding:0 12px;margin:15px 0 7px}.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;margin:3px 0;border-radius:7px;color:#536176;cursor:pointer;font-size:13px}.nav-item:hover{background:var(--bg);color:var(--ink)}.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:600}.nav-dot{width:6px;height:6px;border:1.5px solid currentColor;border-radius:2px;flex:none}.nav-item.active .nav-dot{background:var(--blue);border-color:var(--blue)}.sidebar-foot{padding:16px 18px;border-top:1px solid var(--line)}.version{font-size:11px;color:#9aa4b4;margin-top:8px}.main{margin-left:var(--sidebar);min-height:100vh}.topbar{height:72px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:8}.breadcrumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:16px}.role-preview{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.role-preview select{width:auto;padding:6px 28px 6px 9px;font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;background:#202d49;color:#fff;display:grid;place-items:center;font-size:12px}.content{max-width:1380px;margin:0 auto;padding:32px 36px 64px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:26px}.page-head h1{font-size:25px;line-height:1.35;margin-bottom:5px}.page-head p{color:var(--muted);font-size:13px}.head-actions{display:flex;gap:10px;flex:none}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}.panel-title{font-size:15px;margin-bottom:4px}.panel-sub{font-size:12px;color:var(--muted);margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:18px 20px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:27px;line-height:1.3;margin:5px 0 2px;font-weight:650}.stat-note{font-size:11px;color:#8a95a7}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:500;background:#fafbfc;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 12px;white-space:nowrap}td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcff}.project-name{font-size:13px;font-weight:600;margin-bottom:2px}.todo-list{margin-top:12px}.todo{padding:14px 0;border-bottom:1px solid var(--line)}.todo:last-child{border-bottom:0}.todo b{font-size:12px;display:block;margin-bottom:3px}.todo p{font-size:12px;color:var(--muted)}.notice{padding:12px 15px;background:var(--blue-soft);border-radius:7px;color:#3151ae;font-size:12px;margin-bottom:20px}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:22px}.tab{padding:0 1px 11px;color:var(--muted);font-size:13px;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue);font-weight:600}.empty{padding:60px 24px;text-align:center;color:var(--muted)}
/* 新建分析 */
.steps{display:flex;align-items:center;margin-bottom:24px}.step{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.step-num{width:25px;height:25px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff}.step.active{color:var(--blue);font-weight:600}.step.active .step-num{background:var(--blue);border-color:var(--blue);color:#fff}.step.done .step-num{background:var(--green);border-color:var(--green);color:#fff}.step-line{height:1px;background:var(--line);width:70px;margin:0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.upload-box{border:1px dashed #bdc8db;border-radius:9px;background:#fafbfe;padding:30px;text-align:center;margin:20px 0 16px;cursor:pointer}.upload-box:hover{border-color:var(--blue);background:var(--blue-soft)}.upload-title{font-weight:600;margin-bottom:4px}.upload-box p{font-size:12px;color:var(--muted)}textarea{resize:vertical;min-height:150px;line-height:1.7}.form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.cost{font-size:12px;color:var(--muted)}.clean-result{margin-top:20px;border-top:1px solid var(--line);padding-top:20px}.clean-stats{display:flex;gap:30px;margin:14px 0}.clean-stats b{display:block;font-size:20px}.clean-stats span{font-size:11px;color:var(--muted)}.segment{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.segment b{color:var(--blue);margin-right:9px}
/* 报告 */
.report-head{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px}.report-title-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.report-title-row h1{font-size:23px}.report-meta{display:flex;gap:20px;color:var(--muted);font-size:12px}.report-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.evidence{border-left:3px solid #b7c5ef;background:#f8faff;padding:12px 15px;margin:14px 0;color:#4a5971;font-size:12px}.evidence b{color:var(--blue);margin-right:8px}.report-summary{font-size:14px;line-height:1.9;margin-bottom:20px}.side-section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}.side-section:last-child{border:0;margin:0;padding:0}.side-section h3{font-size:12px;margin-bottom:10px}.side-item{font-size:12px;color:var(--muted);padding:4px 0}.question-chain{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.chain-box{background:var(--bg);padding:13px;border-radius:7px;font-size:12px}.chain-box span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.comment-box{margin-top:16px}.comment-box textarea{min-height:80px}.audit{font-size:12px;padding:13px 0;border-bottom:1px solid var(--line)}.audit:last-child{border:0}.audit b{display:block}.audit span{color:var(--muted)}
/* 问答 */
.chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.chat-panel{min-height:610px;display:flex;flex-direction:column}.chat-log{flex:1;max-height:480px;overflow:auto;padding:4px 0 18px}.message{margin:16px 0;max-width:88%}.message.user{margin-left:auto;text-align:right}.bubble{display:inline-block;text-align:left;background:#f1f3f7;border-radius:9px;padding:11px 14px;font-size:13px;white-space:pre-wrap}.message.user .bubble{background:var(--blue);color:#fff}.citations{margin-top:8px;border-left:2px solid #bcc9ee;padding-left:11px;font-size:11px;color:var(--muted)}.chat-input{display:flex;gap:10px;border-top:1px solid var(--line);padding-top:16px}.chat-input textarea{min-height:62px;flex:1}.chat-input .btn{align-self:flex-end}.suggestion{padding:11px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--blue);cursor:pointer}.suggestion:last-child{border:0}.context-item{padding:9px 0;font-size:12px;border-bottom:1px solid var(--line)}.context-item b{color:var(--blue);margin-right:6px}
/* 权限 */
.permission-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role-card{border:1px solid var(--line);border-radius:8px;padding:15px}.role-card h3{font-size:13px;margin-bottom:4px}.role-card p{font-size:11px;color:var(--muted)}.member-person{display:flex;align-items:center;gap:9px}.mini-avatar{width:28px;height:28px;border-radius:50%;background:#edf1fa;color:#4d5d7a;display:grid;place-items:center;font-size:11px}.member-person b{display:block;font-size:12px}.member-person span{display:block;color:var(--muted);font-size:10px}.no-access{max-width:560px;margin:90px auto;text-align:center}.no-access h1{font-size:22px;margin-bottom:8px}.no-access p{color:var(--muted);margin-bottom:22px}
.toast{position:fixed;right:26px;bottom:26px;background:#202b40;color:#fff;padding:11px 17px;border-radius:8px;font-size:12px;box-shadow:0 8px 30px rgba(20,30,50,.18);z-index:100;animation:toastin .2s ease}@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:1100px){.dashboard-grid,.report-layout,.chat-layout,.permission-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.login-story{padding:48px}.story-main h1{font-size:34px}}
@media(max-width:820px){:root{--sidebar:72px}.sidebar .brand{padding:0;justify-content:center}.sidebar .brand span,.nav-label,.nav-item span,.sidebar-foot{display:none}.nav-item{justify-content:center}.nav-item .nav-dot{width:8px;height:8px}.content{padding:24px 20px}.topbar{padding:0 20px}.login{grid-template-columns:1fr}.login-story{display:none}.report-layout{grid-template-columns:1fr}.page-head{flex-direction:column}.head-actions{width:100%}}
@media(max-width:560px){.stats,.form-grid,.role-cards,.question-chain{grid-template-columns:1fr}.content{padding:20px 14px}.top-actions .role-preview>span{display:none}.breadcrumb{display:none}.login-form-side{padding:28px}.steps{flex-wrap:wrap;gap:10px}.step-line{width:20px;margin:0 4px}.panel{padding:17px}.report-meta{flex-direction:column;gap:2px}}
</style>

<body>
<div id="root"></div>
<script>
const state={page:'login',role:'pm',org:'',reportTab:'needs',cleaned:false,projectView:'projects',chat:[],members:[
 {name:'林然',email:'pm@demo.cn',role:'pm',scope:'全部项目'},
 {name:'陈屿',email:'sales@demo.cn',role:'sales',scope:'3 个授权项目'},
 {name:'周宁',email:'presale@demo.cn',role:'presale',scope:'2 个授权项目'},
 {name:'系统管理员',email:'admin@demo.cn',role:'admin',scope:'全部项目'}
]};
const roles={
 admin:{name:'管理员',desc:'账号、角色和项目授权',pages:['dashboard','report','members']},
 pm:{name:'产品经理',desc:'分析、修正、确认和导出',pages:['dashboard','new','report','chat']},
 sales:{name:'销售',desc:'提交材料与处理客户追问',pages:['dashboard','new','report','chat']},
 presale:{name:'售前',desc:'能力匹配查看与补充意见',pages:['dashboard','report','chat']}
};
const pageNames={dashboard:'项目工作台',new:'新建分析',report:'分析报告',chat:'材料问答',members:'成员与权限'};
const navItems=[['dashboard','项目工作台'],['new','新建分析'],['chat','材料问答'],['members','成员与权限']];
const projects=[
 {name:'制造业数字化改造',scene:'售前需求分析',material:'会议转写 · 35 段',questions:4,time:'今天 16:20',owner:'陈屿',status:'待终审'},
 {name:'学员服务诊断',scene:'学员服务诊断',material:'对话记录 · 30 段',questions:2,time:'今天 14:05',owner:'陈屿',status:'已生成'},
 {name:'零售私域运营',scene:'售前需求分析',material:'微信记录 · 42 段',questions:6,time:'昨天 18:42',owner:'陈屿',status:'待补充'},
 {name:'物流系统二期',scene:'售前需求分析',material:'访谈笔记 · 18 段',questions:0,time:'10 月 25 日',owner:'林然',status:'已确认'}
];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}
function login(){state.page='dashboard';render()}
function showRegister(){state.page='register';render()}
function showLogin(){state.page='login';render()}
function register(){
 const name=document.getElementById('regName').value.trim(),email=document.getElementById('regEmail').value.trim(),org=document.getElementById('regOrg').value.trim();
 const password=document.getElementById('regPassword').value,confirm=document.getElementById('regConfirm').value,agreed=document.getElementById('regAgreement').checked;
 if(!name||!email||!org||!password){toast('请完整填写注册信息');return}
 if(password.length<8){toast('密码至少需要 8 个字符');return}
 if(password!==confirm){toast('两次输入的密码不一致');return}
 if(!agreed){toast('请先阅读并同意服务条款与隐私政策');return}
 state.org=org;state.role='admin';state.members[3]={name,email,role:'admin',scope:'全部项目'};state.page='dashboard';render();toast('团队创建成功，你已成为管理员')
}
function logout(){state.page='login';state.cleaned=false;render()}
function can(page){return roles[state.role].pages.includes(page)}
function go(page){if(!can(page)){toast('当前角色没有此页面权限');return}state.page=page;if(page==='new')state.cleaned=false;render();window.scrollTo(0,0)}
function setRole(role){state.role=role;if(!can(state.page))state.page='dashboard';const tabs=reportTabs();if(!tabs.some(t=>t[0]===state.reportTab))state.reportTab=tabs[0][0];render();toast('已切换为'+roles[role].name+'视图')}
function setReportTab(tab){state.reportTab=tab;render()}
function setProjectView(view){state.projectView=view;render()}
function cleanPreview(){state.cleaned=true;render();toast('清洗预览完成，可进入正式分析')}
function runAnalysis(){state.page='report';state.reportTab=state.role==='sales'?'questions':'needs';render();toast('原型演示：已生成分析报告')}
function exportReport(){toast(state.role==='sales'?'已模拟导出待确认问题':'已模拟导出 Word 报告')}
function confirmNeed(id){if(state.role!=='pm'){toast('只有产品经理可以确认需求');return}toast(id+' 已标记为已确认')}
function addMember(){const email=document.getElementById('newEmail').value.trim();const role=document.getElementById('newRole').value;if(!email){toast('请输入成员邮箱');return}state.members.push({name:email.split('@')[0],email,role,scope:'待授权'});render();toast('已模拟添加成员并发送邀请')}
function changeMemberRole(index,role){state.members[index].role=role;render();toast('成员角色已更新')}
function ask(text){const input=document.getElementById('question');const q=text||(input?input.value.trim():'');if(!q)return;state.chat.push({from:'user',text:q});state.chat.push({from:'ai',text:'从当前材料看，客户更关注统一数据口径和按区域追踪进展。现有材料尚未明确预算与上线时间，建议先确认这两项再判断排期。',cites:['D07 希望能按区域查看任务完成情况','D12 现在的数据口径不统一，开会前总要重新核对']});render();setTimeout(()=>{const log=document.querySelector('.chat-log');if(log)log.scrollTop=log.scrollHeight},0)}
function brand(light){return '<div class="brand"><div class="brand-mark">需</div><span>AI 客户需求分析助手</span></div>'}

function registerPage(){return `<div class="login"><section class="login-story">${brand(true)}<div class="story-main"><div class="eyebrow">Create your workspace</div><h1>从建立团队开始，<br>让材料与判断归到一起。</h1><p>注册后自动创建独立工作空间。你将成为管理员，再邀请销售、产品经理和售前加入。</p><div class="evidence-flow"><div class="flow-result"><div><span>第一步</span><b>创建团队与管理员账号</b></div><div><span>第二步</span><b>邀请成员并指定角色</b></div></div><div class="flow-line"></div><div class="flow-result"><div><span>数据边界</span><b>项目按授权范围开放</b></div><div><span>已有团队</span><b>通过管理员邀请链接加入</b></div></div></div></div><div class="login-foot">独立工作空间 · 固定角色边界 · 项目授权访问</div></section><section class="login-form-side"><form class="login-form register-form" onsubmit="event.preventDefault();register()"><h2>注册并创建团队</h2><p class="sub">创建人自动成为管理员，后续可邀请团队成员</p><div class="form-grid"><div class="field"><label>你的姓名</label><input id="regName" class="input" placeholder="例如：林然" required></div><div class="field"><label>团队 / 企业名称</label><input id="regOrg" class="input" placeholder="例如：星海科技" required></div></div><div class="field"><label>工作邮箱</label><input id="regEmail" class="input" type="email" placeholder="name@company.cn" required></div><div class="form-grid"><div class="field"><label>设置密码</label><input id="regPassword" class="input" type="password" placeholder="至少 8 个字符" required><div class="password-hint">建议组合字母、数字与符号</div></div><div class="field"><label>确认密码</label><input id="regConfirm" class="input" type="password" placeholder="再次输入密码" required></div></div><div class="login-options"><label class="check"><input id="regAgreement" type="checkbox">我已阅读并同意<a class="link" onclick="toast('原型暂未展示服务条款')">服务条款</a>与<a class="link" onclick="toast('原型暂未展示隐私政策')">隐私政策</a></label></div><button class="btn login-submit" type="submit">创建团队并进入工作台</button><div class="auth-switch">已有账号？<a class="link" onclick="showLogin()">返回登录</a></div><div class="demo-note">加入已有团队无需在这里注册，请使用管理员发送的邀请链接设置密码。</div></form></section></div>`}
function sidebar(){return `<aside class="sidebar">${brand()}<nav class="nav"><div class="nav-label">日常工作</div>${navItems.slice(0,3).filter(n=>can(n[0])).map(n=>`<div class="nav-item ${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><i class="nav-dot"></i><span>${n[1]}</span></div>`).join('')}<div class="nav-label">组织管理</div>${navItems.slice(3).filter(n=>can(n[0])).map(n=>`<div class="nav-item ${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><i class="nav-dot"></i><span>${n[1]}</span></div>`).join('')}<div class="nav-item" onclick="toast('质量评测沿用现有独立 Dashboard')"><i class="nav-dot"></i><span>质量评测</span></div></nav><div class="sidebar-foot"><a class="link small-text" onclick="logout()">退出登录</a><div class="version">SaaS 原型 V1 · 非生产版本</div></div></aside>`}

function statsForRole(){if(state.role==='sales')return [['我负责的项目','3','仅显示授权项目'],['待追问客户','12','来自 4 份分析'],['本周已提交','6','材料均已脱敏'],['客户已回复','5','等待补充进项目']];if(state.role==='presale')return [['授权项目','2','只读访问'],['待评估需求','8','集中在能力匹配'],['部分匹配','3','需要补充方案'],['不支持项','1','已标注原因']];return [['进行中的项目','8','本周新增 2 个'],['待确认问题','12','影响需求终审'],['本周新增报告','6','均可追溯引用'],['待人工终审','3','仅产品经理可确认']]}
function dashboard(){const stats=statsForRole();return `<div class="page-head"><div><h1>项目工作台</h1><p>${roles[state.role].desc} · 只展示与你相关的项目和待办</p></div><div class="head-actions">${can('new')?'<button class="btn" onclick="go(\'new\')">新建分析</button>':''}</div></div>${state.role==='sales'?'<div class="notice">销售视图聚焦材料提交和客户追问；完整需求判断由产品经理确认。</div>':state.role==='presale'?'<div class="notice">售前视图聚焦能力匹配与方案补充，不能修改需求状态。</div>':''}<div class="stats">${stats.map(s=>`<div class="stat"><div class="stat-label">${s[0]}</div><div class="stat-value">${s[1]}</div><div class="stat-note">${s[2]}</div></div>`).join('')}</div><div class="tabs"><div class="tab ${state.projectView==='projects'?'active':''}" onclick="setProjectView('projects')">项目列表</div><div class="tab ${state.projectView==='versions'?'active':''}" onclick="setProjectView('versions')">资料与版本</div></div>${state.projectView==='versions'?versionPanel():`<div class="dashboard-grid"><section class="panel"><h2 class="panel-title">最近项目</h2><p class="panel-sub">按最近更新排序，点击项目名称进入报告</p><div class="table-wrap"><table><thead><tr><th>项目</th><th>最新材料</th><th>待确认</th><th>状态</th><th>更新时间</th><th></th></tr></thead><tbody>${projects.map((p,i)=>`<tr><td><div class="project-name"><a class="link" onclick="go('report')">${p.name}</a></div><span class="muted">${p.scene}</span></td><td>${p.material}</td><td>${p.questions?`<span class="pill amber">${p.questions} 项</span>`:'<span class="muted">无</span>'}</td><td><span class="pill ${p.status==='已确认'?'green':p.status==='待补充'?'amber':'blue'}">${p.status}</span></td><td class="muted">${p.time}</td><td><button class="btn text" onclick="go('report')">查看</button></td></tr>`).join('')}</tbody></table></div></section><aside class="panel"><h2 class="panel-title">我的待办</h2><p class="panel-sub">优先处理影响判断的信息缺口</p><div class="todo-list"><div class="todo"><b>确认制造业项目的预算范围</b><p>影响 2 条高优先级需求 · 今天</p></div><div class="todo"><b>补充零售项目的组织权限说明</b><p>客户已回复，等待录入 · 明天</p></div><div class="todo"><b>终审学员服务诊断报告</b><p>AI 草稿已生成 · 本周</p></div></div></aside></div>`}`}
function versionPanel(){return `<section class="panel"><h2 class="panel-title">项目资料与版本</h2><p class="panel-sub">原文、清洗版本和分析运行分开留存，历史版本不可覆盖</p><div class="table-wrap"><table><thead><tr><th>所属项目</th><th>材料</th><th>当前版本</th><th>清洗记录</th><th>最近分析</th><th></th></tr></thead><tbody>${projects.map((p,i)=>`<tr><td class="strong">${p.name}</td><td>${p.material}</td><td><span class="pill gray">V${i+2}</span></td><td>PII 脱敏 · 段落编号完整</td><td>Run 2026102${7-i}</td><td><a class="link" onclick="toast('已打开原文 / 清洗对照原型')">查看对照</a></td></tr>`).join('')}</tbody></table></div></section>`}
function newAnalysis(){return `<div class="page-head"><div><h1>新建分析</h1><p>先确认清洗结果，再消耗 API 运行完整分析</p></div></div><div class="steps"><div class="step active"><span class="step-num">1</span>上传材料</div><div class="step-line"></div><div class="step ${state.cleaned?'active':''}"><span class="step-num">2</span>清洗确认</div><div class="step-line"></div><div class="step"><span class="step-num">3</span>生成报告</div></div><section class="panel"><div class="form-grid"><div class="field"><label>所属项目</label><select><option>制造业数字化改造</option><option>学员服务诊断</option><option>新建项目…</option></select></div><div class="field"><label>分析场景</label><select><option>售前需求分析</option><option>学员服务诊断</option></select></div></div><div class="upload-box" onclick="toast('原型演示：可在这里选择 txt / md 文件')"><div class="upload-title">点击上传，或将材料拖到这里</div><p>支持 txt / md · 单份不超过 10 MB · 上传后自动脱敏</p></div><div class="field"><label>或直接粘贴原始材料</label><textarea id="material">P1 【客户】现在各区域的数据口径不统一，希望统一到同一个看板。\nP2 【销售】需要按区域追踪任务进展吗？\nP3 【客户】对，最好能下钻到负责人。预算和上线时间下次再确认。</textarea></div><div class="form-actions"><span class="cost">清洗预览免费 · 完整分析预计 1～2 分钟</span><button class="btn secondary" onclick="cleanPreview()">清洗预览</button></div>${state.cleaned?`<div class="clean-result"><h2 class="panel-title">清洗结果</h2><div class="clean-stats"><div><b>3</b><span>输入段落</span></div><div><b>3</b><span>有效编号</span></div><div><b>0</b><span>脱敏段落</span></div><div><b>可分析</b><span>材料长度</span></div></div><div class="segment"><b>D01</b>现在各区域的数据口径不统一，希望统一到同一个看板。</div><div class="segment"><b>D02</b>需要按区域追踪任务进展吗？</div><div class="segment"><b>D03</b>对，最好能下钻到负责人。预算和上线时间下次再确认。</div><div class="form-actions"><span class="cost">确认段落与编号无误后继续</span><button class="btn" onclick="runAnalysis()">运行完整分析</button></div></div>`:''}</section>`}
function reportTabs(){if(state.role==='sales')return [['questions','待确认与追问']];if(state.role==='presale')return [['capability','能力匹配'],['questions','待确认信息']];return [['needs','需求分析'],['capability','能力匹配'],['questions','待确认追问'],['audit','修正记录']]}
function report(){const tabs=reportTabs();if(!tabs.some(t=>t[0]===state.reportTab))state.reportTab=tabs[0][0];return `<div class="report-head"><div class="page-head" style="margin:0"><div><div class="report-title-row"><h1>制造业数字化改造</h1><span class="pill amber">AI 草稿</span></div><div class="report-meta"><span>售前需求分析</span><span>材料版本 V3</span><span>Run 20261027</span><span>35 个清洗段落</span></div></div><div class="head-actions"><button class="btn secondary" onclick="toast('已打开原始材料与清洗对照')">查看原始材料</button><button class="btn" onclick="exportReport()">${state.role==='sales'?'导出追问清单':'导出 Word'}</button></div></div></div>${state.role==='sales'?'<div class="notice">你正在查看销售专用视图：只展示信息缺口、客户追问和回复状态。</div>':state.role==='presale'?'<div class="notice">你正在查看售前专用视图：可核对能力匹配并补充方案意见，不能确认需求。</div>':''}<div class="tabs">${tabs.map(t=>`<div class="tab ${state.reportTab===t[0]?'active':''}" onclick="setReportTab('${t[0]}')">${t[1]}</div>`).join('')}</div>${reportBody()}`}

function needsBody(){return `<div class="report-layout"><section class="panel"><h2 class="panel-title">需求分析摘要</h2><p class="panel-sub">AI 提取与推断分离，所有判断保留原文依据</p><p class="report-summary">客户希望统一各区域的数据口径，并在同一工作台追踪任务进展。当前核心缺口是预算范围、上线时间与区域权限边界，未确认前不建议进入排期。</p><div class="evidence"><b>D07</b>「希望按区域查看任务完成情况，不然每周都要人工汇总。」</div><div class="table-wrap"><table><thead><tr><th>编号</th><th>需求</th><th>类型</th><th>优先级</th><th>状态</th><th></th></tr></thead><tbody><tr><td class="strong">EN1</td><td>统一各区域数据口径</td><td>显性需求</td><td><span class="pill blue">高</span></td><td>待确认</td><td><button class="btn text" onclick="confirmNeed('EN1')">确认</button></td></tr><tr><td class="strong">EN2</td><td>按区域追踪并下钻任务进展</td><td>显性需求</td><td><span class="pill blue">高</span></td><td>新发现</td><td><button class="btn text" onclick="confirmNeed('EN2')">确认</button></td></tr><tr><td class="strong">IN1</td><td>可能需要区域级数据权限隔离</td><td>潜在需求</td><td><span class="pill amber">中</span></td><td>待确认</td><td><button class="btn text" onclick="confirmNeed('IN1')">确认</button></td></tr></tbody></table></div></section><aside class="panel"><div class="side-section"><h3>报告可信度</h3><div class="side-item">结构化引用：13 条</div><div class="side-item">未解析引用：0 条</div><div class="side-item">材料覆盖率：8 / 8</div></div><div class="side-section"><h3>终审边界</h3><div class="side-item">AI 结果为草稿，不自动进入排期</div><div class="side-item">潜在需求必须经人工确认</div></div><div class="side-section"><h3>下一步</h3><button class="btn secondary small" onclick="setReportTab('questions')">查看 4 项待确认问题</button></div></aside></div>`}
function capabilityBody(){return `<section class="panel"><h2 class="panel-title">产品能力匹配</h2><p class="panel-sub">结论分为匹配、部分匹配、待确认和不支持，不强行归类</p><div class="table-wrap"><table><thead><tr><th>需求</th><th>匹配结论</th><th>判断依据</th><th>建议动作</th></tr></thead><tbody><tr><td>统一数据看板</td><td><span class="pill green">匹配</span></td><td>现有 C2 支持统一指标配置</td><td>确认字段与口径</td></tr><tr><td>按区域追踪任务</td><td><span class="pill amber">部分匹配</span></td><td>支持区域筛选，下钻层级待验证</td><td>售前补充方案</td></tr><tr><td>区域级数据隔离</td><td><span class="pill gray">待确认</span></td><td>材料未说明角色与组织边界</td><td>先追问客户</td></tr></tbody></table></div>${state.role==='presale'?`<div class="comment-box"><label class="strong small-text">补充售前意见</label><textarea placeholder="记录能力边界、实现条件或方案建议"></textarea><div style="text-align:right;margin-top:10px"><button class="btn small" onclick="toast('售前意见已模拟保存，不修改 AI 原判断')">保存意见</button></div></div>`:''}</section>`}
function questionsBody(){return `<div class="report-layout"><section class="panel"><h2 class="panel-title">信息缺口与客户追问</h2><p class="panel-sub">每个问题都说明为什么需要，而不是只给一张问题清单</p><div class="evidence"><b>D12</b>「预算和上线时间这次还没定，下次再确认。」</div><div class="question-chain"><div class="chain-box"><span>信息缺口</span>预算范围尚不明确</div><div class="chain-box"><span>判断影响</span>无法判断定制边界与优先级</div></div><div class="chain-box" style="margin-bottom:18px"><span>建议追问 Q1</span>「本期看板与区域追踪的预算范围大概是多少？是否包含权限定制？」</div><div class="question-chain"><div class="chain-box"><span>信息缺口</span>区域与角色的可见范围未定义</div><div class="chain-box"><span>判断影响</span>无法确认是否需要数据隔离</div></div><div class="chain-box"><span>建议追问 Q2</span>「区域负责人可以查看其他区域的数据吗？总部角色需要哪些下钻权限？」</div>${state.role==='sales'?`<div class="comment-box"><label class="strong small-text">录入客户回复</label><textarea placeholder="沟通后把客户原话粘贴到这里，作为项目新材料留存"></textarea><div style="text-align:right;margin-top:10px"><button class="btn small" onclick="toast('客户回复已模拟保存到项目')">保存回复</button></div></div>`:''}</section><aside class="panel"><h2 class="panel-title">追问进度</h2><p class="panel-sub">由对应销售处理</p><div class="todo"><b>预算范围</b><p>待追问 · 负责人：陈屿</p></div><div class="todo"><b>区域权限边界</b><p>客户已回复 · 待录入</p></div><div class="todo"><b>上线时间</b><p>待追问 · 本周</p></div></aside></div>`}
function auditBody(){return `<section class="panel"><h2 class="panel-title">人工修正留痕</h2><p class="panel-sub">保留 AI 原判断、人工判断和修改原因，避免覆盖历史</p><div class="audit"><b>林然 · 将 EN2 状态从「新发现」改为「待确认」</b><p>AI 原判断：高优先级；人工判断：维持高优先级，但需先确认区域权限。</p><span>修改原因：权限边界影响实现方案 · 今天 16:42</span></div><div class="audit"><b>林然 · 补充 IN1 判断说明</b><p>AI 原判断：潜在需求；人工判断：保留潜在分类，不升级为显性需求。</p><span>修改原因：客户未直接提出数据隔离 · 今天 16:48</span></div></section>`}
function chatPage(){return `<div class="page-head"><div><h1>材料问答</h1><p>只依据当前项目材料回答；依据不足时明确提示</p></div><div style="width:260px"><select><option>制造业数字化改造</option><option>学员服务诊断</option></select></div></div><div class="chat-layout"><section class="panel chat-panel"><div class="chat-log">${state.chat.length?state.chat.map(m=>`<div class="message ${m.from==='user'?'user':''}"><div class="bubble">${esc(m.text)}</div>${m.cites?`<div class="citations">${m.cites.map(c=>`<div>${esc(c)}</div>`).join('')}</div>`:''}</div>`).join(''):'<div class="empty">输入问题，或从右侧推荐问题开始。<br>回答会附带材料段落编号。</div>'}</div><div class="chat-input"><textarea id="question" placeholder="例如：客户最关心的问题是什么？"></textarea><button class="btn" onclick="ask()">发送</button></div></section><aside><section class="panel"><h2 class="panel-title">可以这样问</h2><p class="panel-sub">围绕当前项目的真实材料</p><div class="suggestion" onclick="ask('客户最关心的问题是什么？')">客户最关心的问题是什么？</div><div class="suggestion" onclick="ask('哪些需求还没有足够依据？')">哪些需求还没有足够依据？</div><div class="suggestion" onclick="ask('下次客户沟通应该问什么？')">下次客户沟通应该问什么？</div></section><section class="panel" style="margin-top:18px"><h2 class="panel-title">引用上下文</h2><p class="panel-sub">当前材料版本 V3</p><div class="context-item"><b>D07</b>按区域查看任务完成情况</div><div class="context-item"><b>D12</b>预算和上线时间尚未确定</div><div class="context-item"><b>D18</b>总部与区域角色待明确</div></section></aside></div>`}
function membersPage(){return `<div class="page-head"><div><h1>成员与权限</h1><p>四种预设角色覆盖当前业务，不开放复杂自定义权限</p></div><div class="head-actions"><button class="btn" onclick="document.getElementById('invite').classList.toggle('hidden')">邀请成员</button></div></div><section id="invite" class="panel hidden" style="margin-bottom:20px"><h2 class="panel-title">邀请新成员</h2><p class="panel-sub">先指定角色，再配置可访问的项目范围</p><div class="form-grid"><div class="field"><label>工作邮箱</label><input id="newEmail" class="input" placeholder="name@company.cn"></div><div class="field"><label>角色</label><select id="newRole"><option value="sales">销售</option><option value="pm">产品经理</option><option value="presale">售前</option><option value="admin">管理员</option></select></div></div><button class="btn small" onclick="addMember()">发送邀请</button></section><div class="permission-grid"><section class="panel"><h2 class="panel-title">团队成员</h2><p class="panel-sub">角色决定操作边界，项目授权决定数据范围</p><div class="table-wrap"><table><thead><tr><th>成员</th><th>角色</th><th>项目范围</th><th>状态</th></tr></thead><tbody>${state.members.map((m,i)=>`<tr><td><div class="member-person"><div class="mini-avatar">${esc(m.name.slice(0,1))}</div><div><b>${esc(m.name)}</b><span>${esc(m.email)}</span></div></div></td><td><select onchange="changeMemberRole(${i},this.value)">${Object.entries(roles).map(([k,v])=>`<option value="${k}" ${m.role===k?'selected':''}>${v.name}</option>`).join('')}</select></td><td>${m.scope}</td><td><span class="pill green">正常</span></td></tr>`).join('')}</tbody></table></div></section><aside class="panel"><h2 class="panel-title">角色说明</h2><p class="panel-sub">业务确认权与系统管理权分离</p><div class="role-cards">${Object.entries(roles).map(([k,v])=>`<div class="role-card"><h3>${v.name}</h3><p>${v.desc}</p></div>`).join('')}</div></aside></div><section class="panel" style="margin-top:20px"><h2 class="panel-title">权限边界</h2><p class="panel-sub">原型采用固定矩阵；「部分」表示只显示该角色需要的报告页签</p><div class="table-wrap"><table><thead><tr><th>能力</th><th>管理员</th><th>产品经理</th><th>销售</th><th>售前</th></tr></thead><tbody><tr><td>上传材料 / 创建分析</td><td>—</td><td>允许</td><td>允许</td><td>—</td></tr><tr><td>查看报告</td><td>全部项目</td><td>全部项目</td><td>部分 · 追问</td><td>部分 · 匹配</td></tr><tr><td>修正与确认需求</td><td>—</td><td>允许</td><td>—</td><td>—</td></tr><tr><td>补充售前意见</td><td>—</td><td>允许</td><td>—</td><td>允许</td></tr><tr><td>导出 Word</td><td>允许</td><td>允许</td><td>仅追问清单</td><td>允许</td></tr><tr><td>成员、角色与项目授权</td><td>允许</td><td>—</td><td>—</td><td>—</td></tr></tbody></table></div></section>`}
function noAccess(){return `<div class="no-access"><h1>当前角色无权访问</h1><p>返回工作台，或切换到管理员角色查看权限页面。</p><button class="btn" onclick="go('dashboard')">返回工作台</button></div>`}
function app(){let body='';if(!can(state.page))body=noAccess();else if(state.page==='dashboard')body=dashboard();else if(state.page==='new')body=newAnalysis();else if(state.page==='report')body=report();else if(state.page==='chat')body=chatPage();else if(state.page==='members')body=membersPage();return `<div class="app">${sidebar()}<main class="main">${topbar()}<div class="content">${body}</div></main></div>`}
function render(){document.getElementById('root').innerHTML=state.page==='login'?loginPage():state.page==='register'?registerPage():app()}
render();
</script>
</body>
</html>
